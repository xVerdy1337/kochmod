 KOCH_EMPTY_WORLD_NAME:0 "Тучи над бурбулестаном сгущаются"
 KOCH_EMPTY_WORLD_DESC:0 "После внутреннего конфликта, члены бурбулестана разделились на независимые государства, каждый имеет свои планы на бурбулестан и намерен его объединить. Также не спят и их внешние враги, которые намерены забрать ресурсы и богатства бурбулеков себе. Тучи сгущаются, и неизвестно, кто объединит эти земли под своим контролем..."
