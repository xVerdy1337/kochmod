 KOCH_B07_podolsk_protests_title:0 "Подольский исследовательский центр уничтожен"
 KOCH_B07_podolsk_protests_desc:0 "25 января фашистские выступления в Подольске переросли в беспорядки. Во время протестов был уничтожен местный исследовательский центр наземной войны. Лаборатории и оборудование утрачены, а исследовательские работы остановлены. Беспорядки также повредили транспортную сеть: уровень инфраструктуры в регионе Москва снизился на 1. Этот удар по научному потенциалу Московской Администрации стал ещё одним проявлением нарастающего политического кризиса."
 KOCH_B07_podolsk_protests_option:0 "Кризис становится всё глубже..."
