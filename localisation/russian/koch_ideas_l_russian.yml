l_russian:
 KOCH_B07_mass_civil_protests:0 "Массовые выступления граждан"
 KOCH_B07_mass_civil_protests_desc:0 "Массовые протесты подрывают стабильность администрации и готовность граждан к войне. На фоне недовольства растёт поддержка фашистов и авторитаристов."
 KOCH_B03_high_crime:0 "Высокая преступность"
 KOCH_B03_high_crime_desc:0 "Преступные группировки подрывают порядок в Волжской Коммуне. Насилие и коррупция ослабляют власть, сокращают людские ресурсы и мешают мобилизации и строительству."
 KOCH_B03_backwater:0 "Захолустье"
 KOCH_B03_backwater_desc:0 "Сельская жизнь способствует росту населения, а развитие инфраструктуры и железных дорог открывает новые возможности. Однако нехватка опытных советников и неэффективная логистика увеличивают расходы."
 KOCH_B08_state_of_scientists:0 "Государство ученых"
 KOCH_B08_state_of_scientists_desc:0 "Научное сообщество определяет развитие ИТМО. Исследования, строительство экспериментальных комплексов и внедрение новых производственных методов пользуются поддержкой государства."
 KOCH_B02_traditional_system:0 "Традиционная система"
 KOCH_B02_traditional_system_desc:0 ""
 KOCH_B02_princely_army:0 "Княжеская армия"
 KOCH_B02_princely_army_desc:0 ""
 KOCH_B01_trilia_legacy:0 "Наследие Трилии"
 KOCH_B01_trilia_legacy_desc:0 ""
 KOCH_B05_marxist_ideas:0 "Идеи Марксизма"
 KOCH_B05_marxist_ideas_desc:0 "Марксистские идеи определяют экономическую политику республики, ускоряя строительство и развитие производства."
 KOCH_B05_terror:0 "Террор"
 KOCH_B05_terror_desc:0 "Репрессии и страх подрывают рост населения и сокращают людские ресурсы. Советники обходятся дороже, а мобилизация замедляется."
 KOCH_B04_democratic_bastion:0 "Оплот Бурбулекской Демократии"
 KOCH_B04_democratic_bastion_desc:0 "Демократические институты укрепляют стабильность республики. Во время оборонительной войны защита армии: §G+10%§!."
 KOCH_B04_bureaucratic_machine:0 "Бюрократическая Машина"
 KOCH_B04_bureaucratic_machine_desc:0 "Разветвлённый аппарат управления повышает политическое влияние, поддерживает рост эффективности производства и ускоряет планирование, но увеличивает потребность в товарах народного потребления."
 KOCH_B04_defensive_war_bonus:0 "Защита демократии в оборонительной войне"
 KOCH_B07_economic_collapse:0 "Экономический коллапс"
 KOCH_B07_economic_collapse_desc:0 "После развала Бурбулестана, Московская Администрация не смогла наладить эффективную экономическую политику, из-за чего она впала в состояние рецессии, пока не случился окончательный крах."
 KOCH_B01_political_diversity:0 "Политическое разнообразие"
 KOCH_B01_political_diversity_desc:0 "Разнообразие политических сил облегчает поиск советников, но ослабляет стабильность и устойчивость правящей идеологии."
 KOCH_B04_pacifism:0 "Пацифизм"
 KOCH_B04_pacifism_desc:0 "Общество предпочитает мирное развитие военным приготовлениям, ограничивая строительство военных заводов и мобилизацию."
