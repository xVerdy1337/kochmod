l_russian:
 KOCH_moscow_shared_tree:0 "Раскол Московской Администрации"
 KOCH_B07_choose_your_side:0 "На пороге раскола"
 KOCH_B07_choose_your_side_desc:0 "Политическое противостояние раскалывает Московскую Администрацию. Выберем сторону, которую поддержим, если напряжённость достигнет 100% и начнётся гражданская война. Кризис ещё можно урегулировать мирным путём."
 KOCH_B07_democratic_path:0 "Защитить Администрацию"
 KOCH_B07_democratic_path_desc:0 "Сохранить верность Московской Администрации и её демократическому правительству. Меры по защите Администрации снизят напряжённость на 15 процентных пунктов. Если война всё же начнётся, мы останемся на стороне защитников Москвы."
 KOCH_B07_fascist_path:0 "Волоколамский Орден"
 KOCH_B07_fascist_path_desc:0 "Поддержать Волоколамский Орден Александра Вандерса. После начала гражданской войны мы возглавим Орден и будем бороться за власть над бывшими территориями Администрации."
 KOCH_B07_imperial_path:0 "Имперская Армия"
 KOCH_B07_imperial_path_desc:0 "Поддержать Имперскую Армию Никиты Калинкина. После начала гражданской войны мы возглавим имперские силы и начнём борьбу за восстановление монархии."
 KOCH_B07_side_choice_event_tt:0 "Откроется событие выбора стороны на случай гражданской войны. Напряжённость растёт на 1 процентный пункт каждые 3 дня; выбор демократов однократно снижает её на 15 пунктов."
 KOCH_B07_path_chosen_by_event_tt:0 "Этот фокус завершается выбором стороны в событии «Чью сторону мы примем?»."
 KOCH_B07_side_choice_title:0 "Чью сторону мы примем?"
 KOCH_B07_side_choice_desc:0 "Московская Администрация стоит на пороге раскола. Демократическое правительство намерено сохранить власть в Москве, Волоколамский Орден Александра Вандерса готовится к восстанию, а Имперская Армия Никиты Калинкина собирает сторонников монархии.\n\nВыберите сторону на случай гражданской войны."
 KOCH_B07_side_choice_democratic:0 "Остаться с Московской Администрацией"
 KOCH_B07_side_choice_fascist:0 "Поддержать Волоколамский Орден"
 KOCH_B07_side_choice_imperial:0 "Примкнуть к Имперской Армии"
 KOCH_B07_side_choice_democratic_tt:0 "Завершится фокус «Защитить Администрацию». Напряжённость снизится на 15 процентных пунктов. Если начнётся гражданская война, вы продолжите управлять Московской Администрацией."
 KOCH_B07_side_choice_fascist_tt:0 "Завершится фокус «Волоколамский Орден». Напряжённость не изменится. Если начнётся гражданская война, вы перейдёте к Волоколамскому Ордену Александра Вандерса."
 KOCH_B07_side_choice_imperial_tt:0 "Завершится фокус «Имперская Армия». Напряжённость не изменится. Если начнётся гражданская война, вы перейдёте к Имперской Армии Никиты Калинкина."
 KOCH_B07_democratic_delay_tt:0 "Во время активного кризиса однократно снижает напряжённость на §G15 процентных пунктов§!."
