l_russian:
 KOCH_B07_civil_war_category:0 "Раскол Московской Администрации"
 KOCH_B07_civil_war_category_desc:0 "§YПолитическая напряжённость:§! [GetKOCHMoscowTension]\n\nНапряжённость растёт на §R1 процентный пункт каждые 3 дня§!. При §R100%§! начнётся трёхсторонняя гражданская война. При §G0%§! кризис будет окончательно урегулирован, а рост напряжённости прекратится.\n\n§YСоотношение сил сторон§!\nМосковская Администрация: §Y[?KOCH_B07_strength_democrats|1]%§!\nВолоколамский Орден: §Y[?KOCH_B07_strength_fascists|1]%§!\nИмперская Армия: §Y[?KOCH_B07_strength_imperial|1]%§!\n\nВыбранная сторона: §Y[GetKOCHMoscowSelectedSide]§!\nПереманено генералов: §Y[?KOCH_B07_pledged_generals|0]§!"
 KOCH_B07_three_sided_war_tt:0 "Начнётся гражданская война между демократами, фашистами и авторитаристами. Каждая сторона будет воевать с двумя остальными."
 KOCH_B07_crisis_interrupted_title:0 "Раскол сорван внешними событиями"
 KOCH_B07_crisis_interrupted_desc:0 "За время кризиса Московская Администрация утратила часть территорий, необходимых для разделения страны. Гражданская война по первоначальному плану не начинается."
 KOCH_MOSCOW_DEMOCRATS:0 "Московская Администрация"
 KOCH_MOSCOW_DEMOCRATS_DEF:0 "Московская Администрация"
 KOCH_MOSCOW_DEMOCRATS_ADJ:0 "Московск."
 KOCH_MOSCOW_FASCISTS:0 "Волоколамский Орден"
 KOCH_MOSCOW_FASCISTS_DEF:0 "Волоколамский Орден"
 KOCH_MOSCOW_FASCISTS_ADJ:0 "Волоколамск."
 KOCH_MOSCOW_AUTHORITARIANS:0 "Имперская Армия"
 KOCH_MOSCOW_AUTHORITARIANS_DEF:0 "Имперская Армия"
 KOCH_MOSCOW_AUTHORITARIANS_ADJ:0 "Имперск."
 KOCH_B07_civil_war_news_title:0 "Гражданская война в Московской Администрации"
 KOCH_B07_civil_war_news_desc:0 "Политический кризис в Московской Администрации перерос в открытую гражданскую войну. Демократическое правительство удерживает Москву, но власть над остальными территориями оспаривают две вооружённые силы.\n\nВолоколамский Орден Александра Вандерса поднял восстание в Твери и Волоколамске. На юге Имперская Армия Никиты Калинкина выступила за восстановление монархии. Все три стороны объявили друг другу войну, и прежняя Администрация раскололась на враждующие лагеря.\n\nСоседние государства следят за развитием событий: исход борьбы за Москву может изменить расстановку сил на всём пространстве бывшего Бурбулестана."
 KOCH_B07_civil_war_news_option:0 "Будущее Москвы решится на поле боя."
 KOCH_B07_resolve_crisis_tt:0 "Напряжённость снизится до §G0%§!. Кризис завершится: гражданская война не начнётся, дальнейший рост напряжённости прекратится."
 KOCH_B07_tension_green:0 "§G[?KOCH_B07_tension|0]%§!"
 KOCH_B07_tension_yellow:0 "§Y[?KOCH_B07_tension|0]%§!"
 KOCH_B07_tension_red:0 "§R[?KOCH_B07_tension|0]%§!"
 KOCH_B07_recruit_officers:0 "Переманить офицеров на свою сторону"
 KOCH_B07_recruit_officers_desc:0 "Убедим офицеров поддержать выбранную нами сторону. Подготовка займёт 30 дней. После её завершения выбранная сторона получит 5 процентных пунктов сил, а каждая из двух других сторон потеряет по 2,5 пункта."
 KOCH_B07_recruit_general:0 "Переманить генерала"
 KOCH_B07_recruit_general_desc:0 "Заручимся поддержкой случайного генерала Московской Администрации, который ещё не присягнул ни одной стороне. Подготовка займёт 30 дней. После её завершения генерал присягнёт выбранной стороне, её доля сил вырастет на 5 процентных пунктов, а доля каждой из двух других сторон уменьшится на 2,5 пункта. Генерал перейдёт к ней при начале гражданской войны. Одного генерала можно переманить только один раз."
 KOCH_B07_strength_can_increase_tt:0 "У каждой из двух других сторон есть не менее 2,5% сил."
 KOCH_B07_unpledged_general_tt:0 "В Московской Администрации есть генерал, которого ещё не переманили."
 KOCH_B07_strength_gain_tt:0 "Доля сил выбранной стороны увеличится на §G5 процентных пунктов§!. Доля каждой из двух других сторон уменьшится на §R2,5 процентного пункта§!."
 KOCH_B07_general_pledge_tt:0 "§G1 случайный генерал§! Московской Администрации присягнёт выбранной стороне и перейдёт к ней при начале гражданской войны. При мирном урегулировании он останется в Администрации."
 KOCH_B07_no_side_selected:0 "Сторона ещё не выбрана"
 KOCH_B07_balance_decisions_unlocked_tt:0 "Во время кризиса откроются решения «Переманить офицеров на свою сторону» и «Переманить генерала» для выбранной стороны."
 KOCH_B07_influence_preparation_tt:0 "Подготовка займёт §Y30 дней§!. Изменения вступят в силу после её завершения, если политический кризис ещё продолжается."
