 KOCH_B11_condition_charge_at_least_50_tt:0 "Заряд Подика не ниже 50%"
 KOCH_B11_condition_vamos_below_100_tt:0 "Влияние Вамоса ниже 100%"
 KOCH_B11_condition_gamos_below_100_tt:0 "Влияние Гамоса ниже 100%"
 KOCH_B11_condition_vamos_at_least_65_tt:0 "Влияние Вамоса не ниже 65%"
