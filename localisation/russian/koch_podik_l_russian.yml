 KOCH_B11_battery_saving:0 "Чудеса по сокращённой программе"
 KOCH_B11_ready_to_charge_tt:0 "Подик исправен, находится на месте, не конфискован и ещё не заряжается"
 KOCH_B11_device_present_tt:0 "Подик исправен, находится на месте и не конфискован"
 KOCH_B11_start_charging_tt:0 "Начнётся зарядка на §Y3 дня§!: по §G20§! пунктов в сутки, после инструкции — по §G30§!. Обычный расход на это время приостанавливается. При достижении 100% зарядка заканчивается досрочно."
 KOCH_B11_saving_tt:0 "Ежедневный расход снизится на §G0,2§! пункта, но не ниже 0,1. Церемоний станет меньше; политическая власть и поддержка войны получат небольшой штраф."
 KOCH_B11_normal_drain_tt:0 "Обычный расход и полное расписание церемоний восстановлены."
 KOCH_B11_auto_charge_tt:0 "При заряде ниже §Y35%§! служба начнёт трёхдневную зарядку. Содержание: §R0,15§! политической власти в день. При конфискации обслуживание и плата приостановлены. Пропажу и поломку служба не устраняет."
 KOCH_B11_stop_auto_charge_tt:0 "Автоматическое обслуживание и расходы на него прекратятся. Уже начатая зарядка закончится своим ходом."
 KOCH_B11_empty_charge_tt:0 "Подик остаётся разряженным. Начните зарядку или воспользуйтесь срочной заменой картриджа; молчание не восстанавливает аккумулятор."
 KOCH_B11_mark_recognition_tt:0 "Откроется фокус «Пророк на полной ставке»."
 KOCH_B11_mark_not_recognized_tt:0 "Фокус «Пророк на полной ставке» останется закрыт. Выбор можно пересмотреть решением «Заказать повторное откровение»."
 KOCH_B11_enable_battery_saving:0 "Выключить декоративное бессмертие"
 KOCH_B11_enable_battery_saving_desc:0 "Сократим выездные обряды и выключим подсветку вечности. Расход уменьшится на 0,2 пункта в сутки, минимум — 0,1. Меньше церемоний означает небольшое снижение политического авторитета и поддержки войны."
 KOCH_B11_disable_battery_saving:0 "Вернуть полное расписание чудес"
 KOCH_B11_disable_battery_saving_desc:0 "Экономрежим отключат, политические штрафы снимут. Расход вернётся к обычному уровню с учётом инструкции и войны."
 KOCH_B11_enable_auto_charge:0 "Назначить дежурного по розетке"
 KOCH_B11_enable_auto_charge_desc:0 "После изучения инструкции можно создать службу обслуживания. При заряде ниже 35% дежурный сам начнёт трёхдневную зарядку. Содержание стоит 0,15 политической власти в день; каждый цикл не требует нового решения. Пропажу или поломку придётся устранять отдельно."
 KOCH_B11_disable_auto_charge:0 "Отправить дежурного в отпуск"
 KOCH_B11_disable_auto_charge_desc:0 "Уберём расходы на службу и вернём ручное управление. Текущую зарядку не прерываем. Повторное создание службы снова потребует 60 политической власти."
 KOCH_B11_status_missing:0 "§Rсвятыня пропала§!"
 KOCH_B11_status_broken:0 "§Rустройство сломано§!"
 KOCH_B11_status_charging:0 "§Gидёт зарядка§!"
 KOCH_B11_status_empty:0 "§Rполное отключение§!"
 KOCH_B11_status_crisis:0 "§Rкризис доверия§!"
 KOCH_B11_status_low:0 "§Yнизкий заряд§!"
 KOCH_B11_status_golden:0 "§Gзолотой век§!"
 KOCH_B11_status_normal:0 "нормальная работа"
 KOCH_B11_mode_saving:0 "экономный"
 KOCH_B11_mode_normal:0 "обычный"
 KOCH_B11_service_auto:0 "автоматическое, −0,15 политической власти в день"
 KOCH_B11_service_manual:0 "ручное"
 KOCH_B11_forecast_unavailable:0 "Прогноз недоступен: сначала требуется розыск или ремонт."
 KOCH_B11_forecast_charging:0 "До конца зарядки: не более §Y[?KOCH_podik_charge_days|0]§! дн. Обычный расход приостановлен."
 KOCH_B11_forecast_crisis:0 "Критическая отметка уже пройдена. Для восстановления порядка нужен заряд не ниже 40%."
 KOCH_B11_forecast_normal:0 "До отметки 20% при текущем расходе: примерно §Y[?KOCH_podik_days_to_crisis|0]§! дн. Прогноз не учитывает будущие церемонии и зарядки."
 KOCH_podik_daily_drain:0 "Ежедневный расход заряда"
 KOCH_podik_charge_days:0 "Оставшееся время зарядки"
 KOCH_podik_days_to_crisis:0 "Дней до критического заряда"
 KOCH_B11_low_battery:0 "Электрик уже предупреждал"
 KOCH_B11_low_battery_desc:0 "Заряд ниже 40%, но критическая отметка ещё не пройдена. Авторитет начинает снижаться. Можно зарядить Подик заранее или сократить церемонии экономрежимом."
 KOCH_B11_empty_battery:0 "Верховная власть выключилась"
 KOCH_B11_empty_battery_desc:0 "Заряд упал до нуля. Это усиленный штраф вместо обычных беспорядков. Положительный заряд вернёт обычный кризис; при 40% порядок восстановится."
 KOCH_B11_battery_saving_desc:0 "Экономрежим снижает ежедневный расход на 0,2 пункта, минимум до 0,1. Без части торжеств режим получает меньше политического авторитета и поддержки войны."
 KOCH_B11_charger_service:0 "Дежурный по розетке"
 KOCH_B11_charger_service_desc:0 "Служба автоматически начинает трёхдневную зарядку при заряде ниже 35%. Содержание стоит 0,15 политической власти в день. Мастера не ищут пропавшие устройства и не устраняют поломки."
 KOCH_B11_status_dormant:0 "ожидает выбора политического пути"
 KOCH_B11_forecast_dormant:0 "Регулярный расход начнётся после выбора священного пути Подика. Совет этой механикой не пользуется."
 KOCH_PODIK.11051.t:0 "Государство помещается в принтер"
 KOCH_PODIK.11051.d:0 "Наминал положил XROS 6 Mini внутрь сломанного принтера. Мама давно не пользуется аппаратом, потому что тот не печатает. Совет безопасности предлагает сохранить неисправность на конституционном уровне.\n\nМать — самостоятельный участник истории: её подозрение растёт от зарядки и публичных церемоний. При 70 придёт предупреждение, при 100 будет назначена проверка через 14 дней."
 KOCH_PODIK.11051.a:0 "Охранять неисправность."
 KOCH_PODIK.11051.b:0 "Сначала убрать комнату."
 KOCH_PODIK.11052.t:0 "Тайник принят на баланс"
 KOCH_PODIK.11052.d:0 "Техник обнаружил в принтере предмет культа. В графе «причина неисправности» он написал: «работает государством». Мама спрашивает, почему ремонтник вышел в парадной форме."
 KOCH_PODIK.11052.a:0 "Оформить как списанный лом."
 KOCH_PODIK.11052.b:0 "Провести торжественное освящение."
 KOCH_PODIK.11053.t:0 "Операция прошла слишком заметно"
 KOCH_PODIK.11053.d:0 "Во время тайной перевозки подика оркестр дважды сыграл гимн. Служба безопасности объяснила маме, что это профилактическое обслуживание. Она попросила счёт за ремонт."
 KOCH_PODIK.11053.a:0 "Признать бытовую неловкость."
 KOCH_PODIK.11053.b:0 "Дослать оркестр на кухню."
 KOCH_PODIK.11054.t:0 "«А почему он у тебя светится?»"
 KOCH_PODIK.11054.d:0 "Мама указывает на щель в корпусе. Наминал объясняет, что это остаточная энергия советского производства. Совет советует не произносить слово «картридж» до ужина."
 KOCH_PODIK.11054.a:0 "Показать старую инструкцию."
 KOCH_PODIK.11054.b:0 "Это секретный оборонный объект."
 KOCH_PODIK.11055.t:0 "Проверка расходников"
 KOCH_PODIK.11055.d:0 "Вместо картриджей мама нашла наградные листы караула. Начальник караула предлагает задержать листы за разглашение. В соседней комнате Наминал пытается вспомнить, что вообще кладут в принтер."
 KOCH_PODIK.11055.a:0 "Купить нормальный тонер."
 KOCH_PODIK.11055.b:0 "Передать проверку военным."
 KOCH_PODIK.11056.t:0 "Одну бумажку. Без революции"
 KOCH_PODIK.11056.d:0 "Маме нужна распечатка. Министерство утверждает, что документ сначала должен пройти государственную экспертизу. «Мне рецепт», — уточняет мама. Ведомство запрашивает рецепт в трёх экземплярах."
 KOCH_PODIK.11056.a:0 "Сходить в копицентр."
 KOCH_PODIK.11056.b:0 "Объявить бумагу вражеской технологией."
 KOCH_PODIK.11057.t:0 "Предупреждение: мама идёт проверять"
 KOCH_PODIK.11057.d:0 "Подозрение достигло 70. Мама уже спрашивает, где отвёртка. Решения уборки, отвлекающей распечатки и тихой зарядки помогут снизить подозрение.\n\nПри 100 проверка будет назначена через 14 дней. Это предупреждение, а не немедленная конфискация. Все три исхода оставляют продолжение игры."
 KOCH_PODIK.11057.a:0 "Вывести уборку на государственный уровень."
 KOCH_PODIK.11058.t:0 "Мама открыла крышку"
 KOCH_PODIK.11058.d:0 "Мы успели убрать комнату. Договоримся без сборов."
 KOCH_PODIK.11058.a:0 "Отдать. Культ продолжит заседать под кроватью."
 KOCH_PODIK.11058.b:0 "Принтер — священная территория!"
 KOCH_PODIK.11058.c:0 "Выносить мусор в обмен на суверенитет."
 KOCH_PODIK.11059.t:0 "Граница проходит по холодильнику"
 KOCH_PODIK.11059.d:0 "Мама получила письменный регламент. При победе материнского контроля культ существует подпольно; вернуть устройство можно переговорами. При революции принтер охраняется, но бытовая холодная война стоит политической власти. Компромисс дешевле войны и дороже вынесенного мусора.\n\nСистема заряда продолжит работать после возврата устройства. Никакая домашняя конституция не ремонтирует поломку автоматически."
 KOCH_PODIK.11059.a:0 "Подписать магнитом."
 KOCH_PODIK.11060.t:0 "Траур и двенадцать постановлений"
 KOCH_PODIK.11060.d:0 "Отец Наминала погиб, упав с балкона. Его могила находится на кладбище «Секрет» в Гробно (Гродно). Дополнительных обстоятельств у комиссии нет.\n\nКабинет обсуждает память, безопасность и создание ведомства, которое запретит несчастьям происходить без согласования."
 KOCH_PODIK.11060.a:0 "Тихая церемония памяти."
 KOCH_PODIK.11060.b:0 "Учредить торжественную неделю отчётности."
 KOCH_PODIK.11061.t:0 "Следствие расследует реакцию следствия"
 KOCH_PODIK.11061.d:0 "Комиссия не располагает новыми фактами о гибели. Зато располагает предложением проверить все ограждения и встречным предложением объявить гравитацию иностранным агентом. Юрист просит не путать профилактику с выдумыванием обстоятельств."
 KOCH_PODIK.11061.a:0 "Проверять ограждения."
 KOCH_PODIK.11061.b:0 "Завести дело против физики."
 KOCH_PODIK.11062.t:0 "Исключение для президентского балкона"
 KOCH_PODIK.11062.d:0 "Инспектор отметил все опасные ограждения, включая президентское. Протокол исчез. Второй инспектор пришёл с копией. Государство вынуждено выбрать между безопасностью и торжественной неприкосновенностью перил."
 KOCH_PODIK.11062.a:0 "Ремонтировать и наш тоже."
 KOCH_PODIK.11062.b:0 "У нашего балкона иммунитет."
 KOCH_PODIK.11063.t:0 "Закон всемирного тяготения не признал суд"
 KOCH_PODIK.11063.d:0 "Судья потребовал отменить притяжение на территории республики. Стакан упал со стола. Пристав составил акт о неуважении к суду. Инженер предложил прикрутить стол к полу и наконец перейти к делу."
 KOCH_PODIK.11063.a:0 "Закрыть процесс, оплатить инженеров."
 KOCH_PODIK.11063.b:0 "Вынести заочный приговор Ньютону."
 KOCH_PODIK.11064.t:0 "Доктрина устойчивого положения"
 KOCH_PODIK.11064.d:0 "Оборонная комиссия извлекла из расследования полезное правило: опора должна быть надёжной, ограждение — исправным, а начальник — хотя бы иногда вменяемым. Последний пункт оставили рекомендательным."
 KOCH_PODIK.11064.a:0 "Обучить сапёров."
 KOCH_PODIK.11064.b:0 "Опубликовать гражданскую памятку."
 KOCH_PODIK.11065.t:0 "Запрос на посещение «Секрета»"
 KOCH_PODIK.11065.d:0 "Подиковая республика просит разрешить делегации посетить могилу отца Наминала. Приложены венок, план маршрута и зачем-то штатная структура оркестра. Артур вправе согласовать поездку или отказать. Плохие отношения требуют дополнительных гарантий."
 KOCH_PODIK.11065.a:0 "Разрешить тихое посещение."
 KOCH_PODIK.11065.b:0 "Потребовать поездку без оркестра."
 KOCH_PODIK.11065.c:0 "Разрешить после отдельного согласования охраны."
 KOCH_PODIK.11066.t:0 "Разрешение получено"
 KOCH_PODIK.11066.d:0 "Артур согласовал посещение. Делегации запрещено превращать кладбище в военную базу. Протокол особенно подчёркивает, что венок не является бронетехникой."
 KOCH_PODIK.11066.a:0 "Поехать с уважением."
 KOCH_PODIK.11067.t:0 "Автобус ждёт согласования"
 KOCH_PODIK.11067.d:0 "Гродненская республика не согласовала первоначальный протокол. Отказ относится к церемонии, а не к памяти. Доступны платное согласование тихой делегации и повторный запрос. Война не требуется."
 KOCH_PODIK.11067.a:0 "Сократить состав делегации."
 KOCH_PODIK.11068.t:0 "«Секрет» оказался кладбищем"
 KOCH_PODIK.11068.d:0 "На кладбище делегация посетила могилу отца Наминала. Смотритель объяснил: название «Секрет» не означает, что здесь спрятан стратегический объект. Министр всё равно попросил допуск."
 KOCH_PODIK.11068.a:0 "Оставить венок и уйти тихо."
 KOCH_PODIK.11068.b:0 "Подготовить большой государственный протокол."
 KOCH_PODIK.11069.t:0 "Дипломатический скандал у могилы"
 KOCH_PODIK.11069.d:0 "Оркестр начал проверку звука. Смотритель потребовал тишины. Советник предложил объявить его вмешательство международным инцидентом. Артур прислал одно предложение: «Не позорьтесь»."
 KOCH_PODIK.11069.a:0 "Извиниться перед смотрителем."
 KOCH_PODIK.11069.b:0 "Считать оркестр пострадавшей стороной."
 KOCH_PODIK.11070.t:0 "Две святыни и одно чувство меры"
 KOCH_PODIK.11070.d:0 "Артур подтвердил совместный протокол. Охрана знает свои границы, делегации не требуют трибун. Даже Министерство падений не смогло найти повод для чрезвычайного положения."
 KOCH_PODIK.11070.a:0 "Это подозрительно похоже на дипломатию."
 KOCH_PODIK.11071.t:0 "Футболка принята на вооружение"
 KOCH_PODIK.11071.d:0 "Вамос заказал демонстрацию физической мощи. Ткань прошла испытания на разрыв. В отчёте указано: «не рвётся». Вамос счёл это вызовом. Гамос запросил места у всех камер."
 KOCH_PODIK.11071.a:0 "Выдать герою трибуну."
 KOCH_PODIK.11071.b:0 "Разместить Гамоса у монтажного пульта."
 KOCH_PODIK.11072.t:0 "Великий разрыв"
 KOCH_PODIK.11072.d:0 "Немедленно сменить государственные штаны."
 KOCH_PODIK.11072.a:0 "Это был звук национального возрождения."
 KOCH_PODIK.11072.b:0 "Обвинить Гамоса в диверсии."
 KOCH_PODIK.11072.c:0 "Засекретить видеозапись на 75 лет."
 KOCH_PODIK.11073.t:0 "Коричневый кризис"
 KOCH_PODIK.11073.d:0 "Комиссия установила, что иностранного следа нет. Есть отечественный след и четырнадцать заявлений о добровольном отказе от первого ряда. Гамос предлагает либо химчистку, либо правительственную чистку."
 KOCH_PODIK.11073.a:0 "Химчистку оплатит бюджет."
 KOCH_PODIK.11073.b:0 "Ответственность оплатит Вамос."
 KOCH_PODIK.11074.t:0 "Оригинал у Гамоса"
 KOCH_PODIK.11074.d:0 "Уничтожить копии ради совместного управления."
 KOCH_PODIK.11074.a:0 "Скрыть запись в обмен на полномочия."
 KOCH_PODIK.11074.b:0 "Показать по государственному телевидению."
 KOCH_PODIK.11074.c:0 "Это происки иностранной прачечной."
 KOCH_PODIK.11075.t:0 "Вторая футболка"
 KOCH_PODIK.11075.d:0 "Вамос заявил: «Теперь точно всё получится». Футболка снова осталась целой. Санитарный батальон покинул позиции организованно, но очень быстро. Гамос выступил с программой смены кабинета и белья."
 KOCH_PODIK.11075.a:0 "Остановить демонстрации немедленно."
 KOCH_PODIK.11075.b:0 "Объявить ткань стратегическим противником."
 KOCH_PODIK.11076.t:0 "Текстиль получил амнистию"
 KOCH_PODIK.11076.d:0 "Производители футболок освобождены от обвинений в противодействии руководству. На площади впервые прошёл митинг без санитарного оцепления. Вамос выступил в куртке."
 KOCH_PODIK.11076.a:0 "Куртку не трогать."
 KOCH_PODIK.11077.t:0 "Архив пахнет историей"
 KOCH_PODIK.11077.d:0 "Кассета занимает отдельную полку. Историки разошлись в оценках, но сошлись в просьбе проветрить помещение. Штаны списаны, влияние председателей сохраняет последствия скандала."
 KOCH_PODIK.11077.a:0 "Закрыть дело. Открыть окно."
 KOCH_PODIK.11078.t:0 "Вамос, дай инфу"
 KOCH_PODIK.11078.d:0 "Вамос сел перед Макафоном. Ему задали вопрос. Он не ответил. Ему уточнили вопрос. Он не уточнил молчание. Гамос объявил, что правительство столкнулось с дефицитом сведений у самого источника."
 KOCH_PODIK.11078.a:0 "Подождать ответа официально."
 KOCH_PODIK.11078.b:0 "Передать вопросы Гамосу."
 KOCH_PODIK.11079.t:0 "Контакт есть. Инфы нет"
 KOCH_PODIK.11079.d:0 "Техник проверил Макафон: аппарат исправен. Вамос тоже прошёл медосмотр. Между ними по-прежнему ничего не происходит. Приглашённый дипломат спросил, является ли это отказом от переговоров."
 KOCH_PODIK.11079.a:0 "Продолжать трансляцию."
 KOCH_PODIK.11079.b:0 "Поставить музыку, пока Гамос пишет ответы."
 KOCH_PODIK.11080.t:0 "Сведения не обнаружены"
 KOCH_PODIK.11080.d:0 "Разведка опросила аппарат, охрану и стул. Стул сообщил больше всех: под ним нашлась записка «не забудь хлеб». Гамос называет это первым связным распоряжением администрации."
 KOCH_PODIK.11080.a:0 "Засекретить хлеб."
 KOCH_PODIK.11080.b:0 "Исполнить хотя бы это распоряжение."
 KOCH_PODIK.11081.t:0 "Пресс-конференция без слов"
 KOCH_PODIK.11081.d:0 "Корреспонденты шевелят губами, Вамос смотрит в Макафон, переводчик молчит синхронно. Гамос показывает жест «кресло освободилось». Протоколист просит не говорить руками одновременно."
 KOCH_PODIK.11081.a:0 "Оплатить синхронное молчание."
 KOCH_PODIK.11081.b:0 "Дать Гамосу письменную колонку."
 KOCH_PODIK.11082.t:0 "Перехвачена тишина особой важности"
 KOCH_PODIK.11082.d:0 "Разведка Гамоса перехватила пустой канал. Эксперты обнаружили семь часов тишины и кашель оператора. Гамос утверждает, что имеет достаточно материала для политических выводов."
 KOCH_PODIK.11082.a:0 "Пусть готовит архив."
 KOCH_PODIK.11082.b:0 "Пусть готовит смену власти."
 KOCH_PODIK.11082.c:0 "Приобщить кашель к позиции Вамоса."
 KOCH_PODIK.11083.t:0 "Государственная тайна нулевого объёма"
 KOCH_PODIK.11083.d:0 "Молчание закрыто грифом. Гамос контролирует выдачу допуска к отсутствующей информации. Вамос впервые получил письменное разрешение ничего не объяснять."
 KOCH_PODIK.11083.a:0 "Каждый пустой лист пронумеровать."
 KOCH_PODIK.11084.t:0 "Молчализм"
 KOCH_PODIK.11084.d:0 "Вамос не дал инфу, зато дал идею: правительство может просто помолчать. Идеология получила поддержку граждан, уже слышавших предыдущие программы. Гамос требует право на отдельный письменный комментарий."
 KOCH_PODIK.11084.a:0 "Единогласно промолчать."
 KOCH_PODIK.11085.t:0 "Кресло занял тот, кто ответил"
 KOCH_PODIK.11085.d:0 "Гамос предъявил досье и предложил исполнять обязанности главы Совета до конституционного финала. Вамос ответа не дал. Если окончательный строй уже установлен, дело ограничится парламентским расследованием: завершённое урегулирование нельзя отменить задним числом."
 KOCH_PODIK.11085.a:0 "Передать полномочия по протоколу."
 KOCH_PODIK.11085.b:0 "Уступить Гамосу влияние, сохранить Совет."
 KOCH_PODIK.11086.t:0 "Из Макафона вынули политику"
 KOCH_PODIK.11086.d:0 "Канал работает. Содержание зависит от выбранной развязки: архив молчания, молчализм или руководство Гамоса. Борьба за влияние и конституционные финалы Совета остаются доступны. На аппарате оставили табличку «Макафон»: это уже государственная традиция."
 KOCH_PODIK.11086.a:0 "Дальше решения хотя бы печатать."
 KOCH_PODIK.11086.b:0 "Сохранить эфир для редкого ответа."
 KOCH_PODIK.11087.t:0 "Мама купила новый принтер"
 KOCH_PODIK.11087.d:0 "Мама принесла рабочий принтер и предложила выбросить старый. Генштаб срочно просит сохранить старый корпус как музей. Мама согласна, если с него хотя бы сотрут пыль."
 KOCH_PODIK.11087.a:0 "Оформить музеем."
 KOCH_PODIK.11087.b:0 "Наконец признаться, зачем он нужен."
 KOCH_PODIK.11088.t:0 "Принтер неожиданно заработал"
 KOCH_PODIK.11088.d:0 "Из корпуса вылез лист: «Не открывать». Впервые работающий принтер воспринимается как государственный переворот. Техник просит вынуть кабель, прежде чем аппарат распечатает бюджет."
 KOCH_PODIK.11088.a:0 "Вынуть кабель без паники."
 KOCH_PODIK.11088.b:0 "Назвать это пророчеством."
 KOCH_PODIK.11089.t:0 "Вамос наконец заговорил"
 KOCH_PODIK.11089.d:0 "После долгого ожидания Вамос наклонился к Макафону. «Нет», — сказал он. Редакция попросила уточнить, относится ли это к вопросу, правительству или наличию информации. Ответа уже не было."
 KOCH_PODIK.11089.a:0 "Записать как полноценную программу."
 KOCH_PODIK.11089.b:0 "Гамос истолкует ответ сам."
 KOCH_PODIK.11090.t:0 "Срочное обращение к нации"
 KOCH_PODIK.11090.d:0 "Вамос семь часов молчал в Макафон. Полная стенограмма заняла ноль страниц. Издательство всё равно выставило счёт за твёрдый переплёт."
 KOCH_PODIK.11090.a:0 "Отказаться от переплёта."
 KOCH_PODIK.11090.b:0 "Заказать подарочное издание."
 KOCH_PODIK.11091.t:0 "На кладбище закончились места"
 KOCH_PODIK.11091.d:0 "В справке о кладбище «Секрет» закончились свободные строки. Министерство приняло это за нехватку мест и подготовило международный ультиматум. Смотритель просит прислать второй бланк."
 KOCH_PODIK.11091.a:0 "Отправить бумагу, отозвать ультиматум."
 KOCH_PODIK.11092.t:0 "Наминал потерял картридж"
 KOCH_PODIK.11092.d:0 "Запасной картридж пропал. Подик исправен и продолжает работать, но розыск уже запросил бюджет больше мобилизационного. Картридж лежит в коробке с надписью «запасной картридж»."
 KOCH_PODIK.11092.a:0 "Прочитать надпись бесплатно."
 KOCH_PODIK.11092.b:0 "Провести учения поисковых частей."
 KOCH_PODIK.11093.t:0 "Ньютон подал апелляцию"
 KOCH_PODIK.11093.d:0 "В судебной канцелярии обнаружен лист, упавший с верхней полки. Прокуратура называет это подписью обвиняемого. Секретарь предлагает прикрепить бумаги скрепкой и перестать вести переписку с природой."
 KOCH_PODIK.11093.a:0 "Принять апелляцию скрепкой."
 KOCH_PODIK.11093.b:0 "Скрепку тоже допросить."
 KOCH_PODIK.11094.t:0 "Макафон запросил отпуск"
 KOCH_PODIK.11094.d:0 "Аппарат семь раз передавал тишину и теперь числится самым стабильным сотрудником правительства. Профсоюз требует отпуск. Гамос подозревает, что даже техника уже научилась уклоняться от ответственности."
 KOCH_PODIK.11094.a:0 "Выдать запасной аппарат."
 KOCH_PODIK.11094.b:0 "Повысить до заместителя."
 KOCH_PODIK.11095.t:0 "Картридж с дипломатическим иммунитетом"
 KOCH_PODIK.11095.d:0 "Охрана нашла в дипломатической сумке картридж и документ о защите двух святынь. Картридж освобождён от досмотра. Документ задержан за отсутствие фотографии."
 KOCH_PODIK.11095.a:0 "Освободить документ."
 KOCH_PODIK.11095.b:0 "Сфотографировать договор на паспорт."
 KOCH_PODIK.11096.t:0 "Футболка пережила два правительства"
 KOCH_PODIK.11096.d:0 "Музей принял неразорванную футболку. На этикетке написано: «единственный участник демонстрации, сохранивший целостность». Гамос попросил убрать этикетку, пока Вамос не прочитал её вслух."
 KOCH_PODIK.11096.a:0 "Оставить честную подпись."
 KOCH_PODIK.11096.b:0 "Добавить героический ореол."
 KOCH_PODIK.11097.t:0 "Жидкость стратегического назначения"
 KOCH_PODIK.11097.d:0 "Кабинет спорит, важнее ли запас жидкости или оплата электричества. Казначей напоминает, что государство без света выглядит одинаково при любом вкусе."
 KOCH_PODIK.11097.a:0 "Сначала инфраструктура."
 KOCH_PODIK.11097.b:0 "Учредить дегустационную комиссию."
 KOCH_PODIK.11098.t:0 "Министерство пара нашло воду"
 KOCH_PODIK.11098.d:0 "Предприятие построено, но инженер просит перестать считать дым из котельной религиозным знамением. Профсоюз требует либо нормальную инструкцию, либо доплату за священное производство."
 KOCH_PODIK.11098.a:0 "Оплатить инженера."
 KOCH_PODIK.11098.b:0 "Вручить котлу орден."
 KOCH_PODIK.11099.t:0 "Комиссия проверяет собственную печать"
 KOCH_PODIK.11099.d:0 "Вамос создал комиссию, Гамос — комиссию по проверке комиссии. Обе запросили один кабинет и две зарплаты. Секретарь предлагает один штат и два ярлыка на двери."
 KOCH_PODIK.11099.a:0 "Один штат. Без третьей комиссии."
 KOCH_PODIK.11099.b:0 "Гамос проверит обоих."
 KOCH_PODIK.11099.c:0 "Вамос утвердит отсутствие замечаний."
 KOCH_PODIK.11100.t:0 "Наука доказала необходимость финансирования"
 KOCH_PODIK.11100.d:0 "Исследователи установили, что простые решения дешевле сложных. Для проверки потребовался большой грант. Следующий проект посвящён тому, почему никто не читает инструкции до поломки."
 KOCH_PODIK.11100.a:0 "Финансировать прикладную работу."
 KOCH_PODIK.11100.b:0 "Опубликовать хотя бы инструкцию."
 KOCH_B11_DEAD_PRINTER:0 "Принтер давно не печатает"
 KOCH_B11_DEAD_PRINTER_desc:0 "Наминал, он же Марк П, обнаружил единственный предмет, который мама уже перестала проверять. Сломанный принтер получает вторую жизнь: теперь он хранит XROS 6 Mini и государственную тайну. Ремонт категорически противопоказан."
 KOCH_B11_PRINTER_CACHE:0 "Идеальный тайник с гарантией"
 KOCH_B11_PRINTER_CACHE_desc:0 "Внутри принтера нет чернил, зато есть верховная власть. Служба безопасности обязана убедиться, что снаружи аппарат выглядит настолько бесполезным, чтобы его не захотелось выбросить."
 KOCH_B11_OPERATION_XROS:0 "Операция «Не трогай, сломано»"
 KOCH_B11_OPERATION_XROS_desc:0 "Перенос подика проводится ночью, под видом переноса подика. Мама не должна узнать, зачем вокруг принтера выставлен почётный караул."
 KOCH_B11_MOTHER_SUSPECTS:0 "Мама что-то подозревает"
 KOCH_B11_MOTHER_SUSPECTS_desc:0 "Человек, однажды нашедший спрятанный дневник, не верит в случайное появление Министерства картриджей. Ввести учёт подозрения. Отныне каждая публичная литания слышна на кухне."
 KOCH_B11_SEALED_LID:0 "Крышка под государственной печатью"
 KOCH_B11_SEALED_LID_desc:0 "Наклейка «не открывать» привлекла больше внимания, чем открытая крышка. Заменим её на сорок страниц акта о невозможности открытия."
 KOCH_B11_CARTRIDGE_INSPECTION:0 "Великая проверка картриджей"
 KOCH_B11_CARTRIDGE_INSPECTION_desc:0 "Мама требует показать расходники. Кабинет предлагает показать расходную часть бюджета: от неё любой нормальный человек сам закроет крышку."
 KOCH_B11_PRINT_DOCUMENT:0 "Распечатай мне одну бумажку"
 KOCH_B11_PRINT_DOCUMENT_desc:0 "В республику поступило самое страшное требование за всю историю внешней политики: принтер должен выполнить своё прямое назначение."
 KOCH_B11_PRINTER_STRATEGIC:0 "Объект особой бесполезности"
 KOCH_B11_PRINTER_STRATEGIC_desc:0 "Неисправность принтера становится государственной гарантией. Военные обязуются не допустить ни вторжения матери, ни подключения USB-кабеля."
 KOCH_B11_exp_condition_0:0 "Решающая проверка ещё не назначена"
 KOCH_B11_SHE_FOUND_IT:0 "Она открыла крышку"
 KOCH_B11_SHE_FOUND_IT_desc:0 "Отложенные проверки не могут продолжаться вечно. Проведём решающий разговор сами. Высокое подозрение уже могло назначить проверку: тогда этот этап будет засчитан после её исхода."
 KOCH_B11_exp_condition_1:0 "Выбран соответствующий исход проверки"
 KOCH_B11_MATERNAL_CONTROL:0 "Победа материнского контроля"
 KOCH_B11_MATERNAL_CONTROL_desc:0 "Мама забрала подик. Культ переходит в подполье, а государство впервые получает приказ, который действительно нельзя оспорить. Заряд хранится; религиозные штрафы и зарядка приостановлены до возврата устройства."
 KOCH_B11_exp_condition_2:0 "Выбран соответствующий исход проверки"
 KOCH_B11_PRINTER_REVOLUTION:0 "Принтерная революция"
 KOCH_B11_PRINTER_REVOLUTION_desc:0 "Принтер объявлен священной территорией. Мама становится Врагом народа №1, однако подписанное соглашение запрещает преследование: республика обороняет крышку, а не устраивает семейную гражданскую войну."
 KOCH_B11_exp_condition_3:0 "Выбран соответствующий исход проверки"
 KOCH_B11_MOTHER_TREATY:0 "Договор с мамой на холодильнике"
 KOCH_B11_MOTHER_TREATY_desc:0 "Подик разрешён по расписанию. Взамен Наминал выносит мусор, не дымит в комнате и перестаёт называть кухню враждебным государством. Подпись магнитом обязательна."
 KOCH_B11_HOUSEHOLD_CONSTITUTION:0 "Конституция двухкомнатной державы"
 KOCH_B11_HOUSEHOLD_CONSTITUTION_desc:0 "Финал семейного кризиса не отменяет государство. Закрепим границы принтера, кухни и полномочий верховной власти. Даже подпольному культу понадобится порядок возврата конфискованной святыни."
 KOCH_B11_NATIONAL_MOURNING:0 "Личное горе, государственный бланк"
 KOCH_B11_NATIONAL_MOURNING_desc:0 "Отец Наминала погиб, упав с балкона, и похоронен на кладбище «Секрет» в Гробно (Гродно). Это всё, что известно. Правительство, в отличие от следствия, уже готово выпустить двенадцать постановлений."
 KOCH_B11_BALCONY_QUESTION:0 "Балконный вопрос"
 KOCH_B11_BALCONY_QUESTION_desc:0 "Комиссия обязана расследовать реакцию государства, не сочиняя обстоятельства гибели. Но её председатель уже требует доставить на допрос всемирное тяготение."
 KOCH_B11_FALLING_MINISTRY:0 "Министерство недопущения падений"
 KOCH_B11_FALLING_MINISTRY_desc:0 "Министр обещает, что ни один вопрос не выпадет из повестки. Для отчётности ведомство займёт первый этаж и запретит слово «спуск»."
 KOCH_B11_AUDIT_BALCONIES:0 "Проверить все балконы. Кроме нашего"
 KOCH_B11_AUDIT_BALCONIES_desc:0 "Комиссия осматривает ограждения и публикует меры безопасности. Президентский балкон исключён из проверки как носитель суверенитета. Аудитор предлагает всё-таки включить его."
 KOCH_B11_GRAVITY_TRIAL:0 "Суд над всемирным тяготением"
 KOCH_B11_GRAVITY_TRIAL_desc:0 "Обвиняемый не явился, но продолжает оказывать давление на суд. Прокуратура называет это отягчающим обстоятельством. Инженеры просят сначала закончить ремонт перил."
 KOCH_B11_BAN_BALCONIES:0 "Балконов больше не будет"
 KOCH_B11_BAN_BALCONIES_desc:0 "Запрет балконов впечатляет дикторов. Реальная программа безопасности впечатляет строителей. На обе программы средств нет."
 KOCH_B11_SAFE_RAILINGS:0 "Перила сильнее резолюций"
 KOCH_B11_SAFE_RAILINGS_desc:0 "Вместо войны с архитектурой республика заказывает ограждения, осмотры и нормальные инструкции. Оратор жалуется, что это невозможно торжественно проклясть."
 KOCH_B11_BALCONY_DOCTRINE:0 "Балконная доктрина"
 KOCH_B11_BALCONY_DOCTRINE_desc:0 "У солдата должна быть опора, у укрепления — ограждение, у приказа — автор. Из государственного безумия удалось извлечь хотя бы оборонную доктрину."
 KOCH_B11_GROBNO_EXPEDITION:0 "Экспедиция в Гробно"
 KOCH_B11_GROBNO_EXPEDITION_desc:0 "Посещение кладбища «Секрет» требует согласования с Гродненской республикой. Родственная память не даёт дипломатического иммунитета автобусу с оркестром."
 KOCH_B11_exp_condition_4:0 "Получено разрешение на посещение кладбища"
 KOCH_B11_SECRET_CEMETERY:0 "Кладбище «Секрет»"
 KOCH_B11_SECRET_CEMETERY_desc:0 "После получения разрешения делегация сможет посетить могилу отца Наминала. При отказе доступны повторные переговоры; война не является входным билетом."
 KOCH_B11_GRAVESIDE_PROTOCOL:0 "Скандал у могилы"
 KOCH_B11_GRAVESIDE_PROTOCOL_desc:0 "Протокольная служба требует гимн, оркестр требует сцену, смотритель требует вести себя прилично. Выбор последнего варианта почему-то считается дипломатическим прорывом."
 KOCH_B11_exp_condition_5:0 "Артур согласовал охрану и посещение кладбища"
 KOCH_B11_TWO_SHRINES:0 "Договор о защите двух святынь"
 KOCH_B11_TWO_SHRINES_desc:0 "Охрана туза Артура и уважение кладбища объединены одним регламентом: не мешать хозяевам и не путать церемонию с оккупацией."
 KOCH_B11_JOINT_REMEMBRANCE:0 "Без оркестра тоже считается"
 KOCH_B11_JOINT_REMEMBRANCE_desc:0 "Совместная церемония проходит спокойно. Это настолько непривычно, что телевидение просит повторить, но уже с инцидентом. Артур и делегация отказывают одновременно."
 KOCH_B11_LAST_SHIRT:0 "Последняя футболка Республики"
 KOCH_B11_LAST_SHIRT_desc:0 "Вамос обещает разорвать футболку и доказать силу власти. Казначей просит взять старую: новая уже включена в мобилизационный резерв."
 KOCH_B11_GREAT_RIP:0 "Подготовить Великий разрыв"
 KOCH_B11_GREAT_RIP_desc:0 "Камеры включены, оркестр играет, государственная медицина заранее предупреждена. Только служба снабжения почему-то не выдала запасных штанов."
 KOCH_B11_BROWN_COMMISSION:0 "Комиссия по запаху власти"
 KOCH_B11_BROWN_COMMISSION_desc:0 "Нельзя расследовать запах, говорят юристы. Можно расследовать расходы на его сокрытие, отвечает Гамос и приносит видеозапись."
 KOCH_B11_GAMOS_TAPE:0 "У Гамоса есть копия"
 KOCH_B11_GAMOS_TAPE_desc:0 "Скрыть запись ради устойчивости Совета, продать молчание за влияние или опубликовать? Каждый вариант меняет баланс власти. Футболка по-прежнему не изменилась."
 KOCH_B11_TROUSER_RESERVE:0 "Стратегический резерв штанов"
 KOCH_B11_TROUSER_RESERVE_desc:0 "Генштаб выделяет отдельную строку снабжения. Доктрина требует, чтобы каждая демонстрация силы имела запасной выход и запасную пару."
 KOCH_B11_SECOND_DEMONSTRATION:0 "Теперь точно порвётся"
 KOCH_B11_SECOND_DEMONSTRATION_desc:0 "Повторная демонстрация добровольна. На этот раз за сценой дежурит целый санитарный батальон. Комиссия уточняет: футболка опять та же."
 KOCH_B11_TAILOR_AMNESTY:0 "Амнистия для текстильной отрасли"
 KOCH_B11_TAILOR_AMNESTY_desc:0 "Официально признаем, что ткань прочнее государственных обещаний. Вамос прекращает выступления с раздеванием; казна прекращает финансировать химчистку площади."
 KOCH_B11_SHIRT_HISTORY:0 "История, которую отстирали"
 KOCH_B11_SHIRT_HISTORY_desc:0 "Архивисты сохранят оригинал, пропагандисты — удобную версию, снабженцы — запас белья. Закроем кризис до того, как Совет закажет третий дубль."
 KOCH_B11_GIVE_INFO:0 "Вамос, дай инфу"
 KOCH_B11_GIVE_INFO_desc:0 "В Макафон задан единственный вопрос: что происходит? Вамос рассматривает аппарат так, словно это повестка. Отсутствие ответа становится предметом государственной политики."
 KOCH_B11_MAKAFON_ON:0 "Макафон включён"
 KOCH_B11_MAKAFON_ON_desc:0 "Именно Макафон. Так написано в накладной, и исправлять документ дороже, чем построить новую радиостанцию. Индикатор горит. Вамос молчит."
 KOCH_B11_NO_INFORMATION:0 "Секретная информация отсутствует"
 KOCH_B11_NO_INFORMATION_desc:0 "Государственную тайну невозможно украсть: никто, включая носителя, не знает её содержания. Гамос предлагает назначить комиссию по добыче хотя бы одного существительного."
 KOCH_B11_WORDLESS_PRESS:0 "Пресс-конференция без слов"
 KOCH_B11_WORDLESS_PRESS_desc:0 "Корреспондентам разрешено задавать вопросы жестами. Переводчик получает ставку за синхронное молчание. Гамос уже составляет список преемников."
 KOCH_B11_GAMOS_INTERCEPT:0 "Перехватить пустой канал"
 KOCH_B11_GAMOS_INTERCEPT_desc:0 "Разведка Гамоса перехватила семь часов тишины и просит ещё бюджет на расшифровку. Можно превратить отсутствие информации в присутствие нового руководителя."
 KOCH_B11_SILENCE_SECRET:0 "Гриф «совершенно нечего сообщить»"
 KOCH_B11_SILENCE_SECRET_desc:0 "Спрячем молчание в архиве. Гамос получает контроль над доступом; Вамос получает право не отвечать официально."
 KOCH_B11_SILENCE_IDEOLOGY:0 "Молчализм как государственная идея"
 KOCH_B11_SILENCE_IDEOLOGY_desc:0 "Молчание становится идеологией. Вамос получает поддержку тех, кто устал слушать правительство. Производственная планёрка сокращается до кивка."
 KOCH_B11_GAMOS_COUP:0 "Переворот без звукового сопровождения"
 KOCH_B11_GAMOS_COUP_desc:0 "Гамос требует информацию, не получает её и занимает кресло временного руководителя. Конституционный финал Совета ещё можно выбрать позже. После окончательного урегулирования переворот заменяется парламентским расследованием."
 KOCH_B11_VOICE_THAT_WASNT:0 "Голос, которого не было"
 KOCH_B11_VOICE_THAT_WASNT_desc:0 "Секретность, молчализм или временная власть Гамоса: выбранный ответ уже изменил Совет. Теперь надо решить, способен ли Макафон передавать хотя бы решения, подписанные на бумаге."
 KOCH_B11_mark_p:0 "Наминал (Марк П)"
 KOCH_B11_status_confiscated:0 "§Oконфискован матерью; культ в подполье§!"
 KOCH_PODIK.11101.t:0 "Тихая делегация вместо оркестра"
 KOCH_PODIK.11101.d:0 "Подиковая республика предлагает ограниченный визит без митинга, вооружённого караула и оркестра. Протокол не требует дружбы, союза или уступок: посещение могилы не должно становиться заложником чужой риторики."
 KOCH_PODIK.11101.a:0 "Согласовать ограниченное посещение."
 KOCH_B11_printer_cache:0 "Государство внутри принтера"
 KOCH_B11_printer_cache_desc:0 "Тайник помогает хранить секреты, но ежедневное подозрение матери растёт."
 KOCH_B11_printer_guard:0 "Караул у сломанной крышки"
 KOCH_B11_printer_guard_desc:0 "Охрана тайника требует содержания."
 KOCH_B11_underground_cult:0 "Культ под кроватью"
 KOCH_B11_underground_cult_desc:0 "Мама победила. Подик можно вернуть переговорами, но утраченная публичность культа остаётся политической ценой."
 KOCH_B11_holy_printer:0 "Священная территория принтера"
 KOCH_B11_holy_printer_desc:0 "Открытие крышки без допуска запрещено законом."
 KOCH_B11_mother_enemy:0 "Мама — Враг народа №1"
 KOCH_B11_mother_enemy_desc:0 "Мать Наминала оспаривает культ, а государство содержит аппарат домашней холодной войны. Неприкосновенность матери гарантирована соглашением."
 KOCH_B11_household_treaty:0 "Мирный договор с мамой"
 KOCH_B11_household_treaty_desc:0 "Выносить мусор и соблюдать расписание дешевле чрезвычайного положения."
 KOCH_B11_mourning:0 "Государственный траур"
 KOCH_B11_mourning_desc:0 "Память требует уважения. Временный траур замедляет политическую суету."
 KOCH_B11_falling_ministry:0 "Министерство недопущения падений"
 KOCH_B11_falling_ministry_desc:0 "Профилактика превратилась в отдельное ведомство."
 KOCH_B11_balcony_ban:0 "Балконы вне закона"
 KOCH_B11_balcony_ban_desc:0 "Радикальная архитектурная кампания расходует строительные ресурсы."
 KOCH_B11_safe_railings:0 "Государственная программа перил"
 KOCH_B11_safe_railings_desc:0 "Инженеры получили работу, граждане — исправные ограждения."
 KOCH_B11_balcony_doctrine:0 "Балконная доктрина"
 KOCH_B11_balcony_doctrine_desc:0 "Надёжная опора и оборонная подготовка пережили расследование комиссии."
 KOCH_B11_two_shrines:0 "Две святыни под защитой"
 KOCH_B11_two_shrines_desc:0 "Согласованные церемонии и охрана укрепляют доверие."
 KOCH_B11_brown_crisis:0 "Коричневый кризис"
 KOCH_B11_brown_crisis_desc:0 "Вамос обосрался, футболка осталась целой, а правительство пытается отстирать легитимность."
 KOCH_B11_trouser_reserve:0 "Стратегический резерв штанов"
 KOCH_B11_trouser_reserve_desc:0 "Снабжение впервые подготовлено к последствиям демонстрации силы."
 KOCH_B11_silence_archive:0 "Архив несуществующей информации"
 KOCH_B11_silence_archive_desc:0 "Секретность передана Гамосу вместе с бюджетом на хранение пустоты."
 KOCH_B11_silence_ideology:0 "Молчализм"
 KOCH_B11_silence_ideology_desc:0 "Тишина сокращает совещания и оставляет рабочим время на производство."
 KOCH_B11_gamos_regency:0 "Временное руководство Гамоса"
 KOCH_B11_gamos_regency_desc:0 "Гамос занял кресло до конституционного финала."
 koch_podik_household:0 "Мама, принтер и государственная тайна"
 koch_podik_household_desc:0 "Подозрение мамы: §Y[?KOCH_mother_suspicion|1]/100§!. До развязки растёт на 0,15 в день. Зарядка без тихого режима добавляет 1 в день, литания и розыск — 10. На 70 придёт предупреждение, на 100 назначается проверка через 14 дней. Проверка предлагает три исхода. Понижение подозрения ниже 85 открывает бесплатный компромисс."
 koch_podik_stories:0 "Дела, которые не помещаются в протокол"
 koch_podik_stories_desc:0 "Переговоры о кладбище, политика Совета и секретные архивы. Повторные обращения требуют времени и политической власти. Отказ Артура не требует войны."
 KOCH_B11_confiscation_tt:0 "Подик конфискован. Заряд сохранён; зарядка, автоматическая плата и штрафы за разряд приостановлены. Возврат доступен решением. Поломка и пропажа от этого не устраняются."
 KOCH_B11_return_device_tt:0 "Сохранённый заряд и автоматическое обслуживание возобновятся. Поломку и пропажу при необходимости устраняют отдельные решения."
 KOCH_B11_suspicion_down_tt:0 "Подозрение мамы снизится на §G20§! (минимум 0)."
 KOCH_B11_quiet_charge_tt:0 "На §Y30 дней§! подозрение не растёт от зарядки. Обычный расход батареи сохраняется."
 KOCH_B11_mother:0 "Мать Наминала"
 KOCH_B11_mother_desc:0 "Мать Наминала, противница подика и единственный человек, перед которым Министерство безопасности убирает комнату без напоминания."
 KOCH_B11_clean_room:0 "Убрать комнату по мобилизационному плану"
 KOCH_B11_clean_room_desc:0 "До развязки; подозрение ниже на 20. Повтор через 30 дней."
 KOCH_B11_exp_condition_6:0 "До развязки; подозрение ниже на 20. Повтор через 30 дней."
 KOCH_B11_decoy_print:0 "Заказать отвлекающую распечатку"
 KOCH_B11_decoy_print_desc:0 "До развязки; подозрение ниже на 20. Повтор через 45 дней."
 KOCH_B11_exp_condition_7:0 "До развязки; подозрение ниже на 20. Повтор через 45 дней."
 KOCH_B11_quiet_charge:0 "Заряжать без торжественного караула"
 KOCH_B11_quiet_charge_desc:0 "До развязки; тихая зарядка действует 30 дней."
 KOCH_B11_exp_condition_8:0 "До развязки; тихая зарядка действует 30 дней."
 KOCH_B11_return_device:0 "Попросить вернуть подик"
 KOCH_B11_return_device_desc:0 "Подик конфискован матерью. Возврат сохраняет исход победы матери и не чинит устройство."
 KOCH_B11_exp_condition_9:0 "Подик конфискован матерью. Возврат сохраняет исход победы матери и не чинит устройство."
 KOCH_B11_cemetery_retry:0 "Повторить запрос Артуру"
 KOCH_B11_cemetery_retry_desc:0 "Гродненская республика существует; нет войны, разрешения или ожидающего запроса."
 KOCH_B11_exp_condition_10:0 "Гродненская республика существует; нет войны, разрешения или ожидающего запроса."
 KOCH_B11_cemetery_quiet_deal:0 "Согласовать делегацию без оркестра"
 KOCH_B11_cemetery_quiet_deal_desc:0 "После отказа Артура; нет войны или ожидающего запроса. Доступ обеспечит ограниченный протокол посещения."
 KOCH_B11_exp_condition_11:0 "После отказа Артура; нет войны или ожидающего запроса. Доступ обеспечит ограниченный протокол посещения."
 KOCH_B11_denounce_cache:0 "Донести на тайник Наминала"
 KOCH_B11_denounce_cache_desc:0 "Совет пришёл к власти, и принтерная история начата; однократный донос даёт Гамосу 10 влияния."
 KOCH_B11_exp_condition_12:0 "Совет пришёл к власти, и принтерная история начата; однократный донос даёт Гамосу 10 влияния."
 KOCH_B11_council_printer_dossier:0 "Досье Совета: тайник Наминала"
 KOCH_B11_council_printer_dossier_desc:0 "Совет у власти; принтерная история ещё не начата. Открывает бытовой кризис без религиозной ветки."
 KOCH_B11_exp_condition_13:0 "Совет у власти; принтерная история ещё не начата. Открывает бытовой кризис без религиозной ветки."
 KOCH_B11_exp_device_access_tt:0 "Подик не конфискован матерью"
 KOCH_B11_condition_mother_below_85_tt:0 "Подозрение мамы ниже 85"
 KOCH_mother_suspicion:0 "Подозрение мамы"
 KOCH_confiscated_charge:0 "Сохранённый заряд конфискованного подика"
