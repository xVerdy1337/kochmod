 KOCH_B11_charge_treason:0 "Разрядка как государственная измена"
 KOCH_B11_evaporation_revolution:0 "Испарительная революция"
 KOCH_B11_mark_prophet:0 "Пророчества Марка П"
 KOCH_B11_podik_above_state:0 "Подик выше институтов"
 KOCH_B11_two_chairs:0 "Два стула, один бюджет"
 KOCH_B11_split_power:0 "Власть пополам"
 KOCH_B11_great_compromise:0 "Великий компромисс"
 KOCH_B11_single_chair:0 "Единственный председатель"
 KOCH_B11_two_presidents:0 "Две канцелярии — две смены"
 KOCH_B11_ace_guard:0 "Государственная охрана туза"
 KOCH_B11_border_fever:0 "Пограничная тузовая лихорадка"
 KOCH_B11_logistics:0 "Логистика на честном скотче"
 KOCH_B11_charge_ritual:0 "Приложить веру к розетке"
 KOCH_B11_public_litany:0 "Литургия с расходом батареи"
 KOCH_B11_replace_cartridge:0 "Замена без смены режима"
 KOCH_B11_back_vamos:0 "Добавить Вамосу микрофон"
 KOCH_B11_back_gamos:0 "Выдать Гамосу право последнего слова"
 KOCH_B11_emergency_vote:0 "Примирить за счёт бюджета"
 KOCH_B11_send_ace_guard:0 "Повторно предложить охрану"
 KOCH_B11_issue_ultimatum:0 "Повторить ультиматум разборчиво"
 KOCH_friendship:0 "Дипломатические гостинцы"
 KOCH_brotherhood:0 "Гродненско-подиковое братство"
 KOCH_cold_shoulders:0 "Официальное невмешательство с обидой"
 KOCH_diplomatic_insult:0 "Дипломатический выговор"
 KOCH_hostility:0 "Гродненский кризис"
 KOCH_PODIK.11001.t:0 "Протокол об отсутствии предмета"
 KOCH_PODIK.11001.d:0 "В президентском кабинете нашли бюджет позапрошлого года и бутерброд с дипломатическим иммунитетом. Подика нет. Комиссия установила, что последний раз его видели там, где он должен был находиться. Следователь называет это зацепкой.\n\nВамос требует проверить Гамоса. Гамос требует проверить методологию. Казначей спрашивает, нельзя ли просто купить новый, пока розыск не обошёлся дороже государства."
 KOCH_PODIK.11002.t:0 "Подик приобретён"
 KOCH_PODIK.11002.d:0 "Сегодня в столицу доставлен Vaporesso XROS 6 Mini. Караул встретил коробку оружием: после предыдущих закупок коробкам здесь не доверяют. Марк П вынул устройство, и площадь замолчала. Кто-то спросил про больницу. Его вопрос отнесли к предыдущей эпохе.\n\nПодик приобретён. История разделилась на до и после. Теперь республика решит, кому принадлежит будущее: молчаливой святыне или двум разговорчивым спасителям."
 KOCH_PODIK.11003.t:0 "Молчание как форма правления"
 KOCH_PODIK.11003.d:0 "Подику задали вопрос об экономике. Устройство не ответило. Марк П объявил ответ настолько глубоким, что тот ещё не проявился. Кабинет согласился не торопить мудрость.\n\nВыборная республика уступает место служителям святыни. Выборы отменены: предмет, не умеющий обещать, признан честнее всех кандидатов. Отныне заряд устройства станет вопросом политической устойчивости."
 KOCH_PODIK.11004.t:0 "Два руководителя. Ответственный не установлен"
 KOCH_PODIK.11004.d:0 "Совет вступил в должность. На вопрос о главном руководителе оба показали на себя, а на вопрос о долгах — друг на друга. Подик оставлен в сейфе как доказательство предыдущего курса.\n\nВласть поделена поровну. Поддержка одного председателя отнимает влияние у другого. Заводы просят не доводить спор до стадии, когда приказы снова придётся исполнять в обратном порядке."
 KOCH_PODIK.11005.t:0 "Поклон по утверждённому образцу"
 KOCH_PODIK.11005.d:0 "Комитет сообщает об успехе церемонии. Восемь человек поклонились раньше команды, семнадцать — после. Один спросил, почему для поклонов выделено больше автобусов, чем для эвакуации. Его замечание передано духовной комиссии.\n\nС трибуны предлагают объявить народ достаточно единым либо провести дополнительное богослужение. Второй вариант требует генератора и ещё одного совершенно добровольного сбора."
 KOCH_PODIK.11006.t:0 "Удлинитель дальнего действия"
 KOCH_PODIK.11006.d:0 "Паломники добрались до розетки. Удлинитель остался у организатора шествия. Генштаб предлагает считать это отработкой действий при нарушении снабжения. Организатор предлагает считать штаб виноватым.\n\nИнженер принёс кабель и попросил больше не называть его проводником божественной энергии. Можно зарядить устройство сейчас либо сначала провести совещание о чудесной роли инженера в истории."
 KOCH_PODIK.11007.t:0 "Государство на последнем проценте"
 KOCH_PODIK.11007.d:0 "Индикатор опустился ниже критической отметки. На площади требуют объяснений; чиновники уверяют, что проценты скоро завезут. Заводы приостанавливают смены: никто не хочет работать в день конца света.\n\nПока заряд не поднимется не ниже 40%, беспорядки продолжат подрывать режим. Отрицание показаний может выиграть время, но исправная розетка остаётся единственным устойчивым аргументом."
 KOCH_PODIK.11008.t:0 "Марк П получил входящий"
 KOCH_PODIK.11008.d:0 "Марк заявил, что картридж говорил с ним ночью. Воспроизвести разговор нельзя: святыня не давала согласия на запись. Из тезисов следует необходимость расширения полномочий Марка и командировок к розетке.\n\nБогословы настаивают на чуде, инженеры предлагают проверить контакты. Бухгалтер готов финансировать любой вариант, в котором пророчества начнут приходить реже."
 KOCH_PODIK.11009.t:0 "Империя с инструкцией по сборке"
 KOCH_PODIK.11009.d:0 "Республика стала Подиковой империей. На карте появился титул, в казначействе — прежний остаток. Генштаб получил поручение подготовить соседей к счастью, которого они не заказывали.\n\nИмперский мандат позволяет готовить цели войны против независимых соседей вне нашего союза. Дружественное Гродно исключено: охранять туз и вторгаться к его владельцу оказалось слишком сложно даже для наших юристов."
 KOCH_PODIK.11010.t:0 "Конституция уступила место на тумбочке"
 KOCH_PODIK.11010.d:0 "Государство признано обслуживающей организацией при XROS 6 Mini. Парламент обсуждает положение устройства, суд толкует его молчание, казначейство оплачивает свет.\n\nМарк остаётся земным представителем святыни. Ему поручено проводить священные собрания и объяснять, почему вечный источник легитимности нуждается в запчастях. Экспансия уступает место внутреннему культу."
 KOCH_PODIK.11011.t:0 "Вамос предлагает двигаться"
 KOCH_PODIK.11011.d:0 "Вамос объявил необходимость рывка. Карта направления не подготовлена, но противник хотя бы не предугадает маршрут. Гамос возражает, что маршрут не предугадает и само правительство.\n\nПоддержка программы усилит Вамоса. Можно дать слово коллеге: производство просит заранее сообщить, какое из противоречащих постановлений считать действующим."
 KOCH_PODIK.11012.t:0 "Возражение поступило раньше предложения"
 KOCH_PODIK.11012.d:0 "Канцелярия Гамоса зарегистрировала возражение на ещё не составленный документ. Он объясняет это качественной подготовкой. Вамос требует вернуть время, украденное преждевременным обсуждением.\n\nЧто ценнее: предотвратить ошибку или хотя бы раз её совершить? В обоих случаях влияние одного председателя изменится за счёт другого."
 KOCH_PODIK.11013.t:0 "Исследование само себя согласовало"
 KOCH_PODIK.11013.d:0 "Комиссия открыла лабораторию и неожиданно произвела результат. Инженеры выяснили, что приборы работают лучше без председателей рядом. Совет требует проверить, не является ли это оскорблением власти.\n\nУчёные просят постоянное финансирование. Оно даст новую исследовательскую группу, но потребует расходов. Можно вместо этого передать результаты существующим предприятиям."
 KOCH_PODIK.11014.t:0 "Запрет вступил в силу против авторов"
 KOCH_PODIK.11014.d:0 "Внутренняя оппозиция запрещена. Первой под запрет попала деятельность второго подписанта. Второй немедленно установил, что первый тоже является оппозицией. Полиция просит указать порядок задержания.\n\nЮристы предлагают изъять документ, пока председатели не начали выдавать друг на друга ориентировки с одинаковой государственной печатью."
 KOCH_PODIK.11015.t:0 "Дело Гамоса, том первый"
 KOCH_PODIK.11015.d:0 "В папке Вамоса есть фотография Гамоса возле комиссии, фотография комиссии без Гамоса и записка о подозрительном отсутствии фотографа. Прокуратура считает материал достаточным для большой политической карьеры.\n\nПродолжение наступления усилит Вамоса. Промышленники напоминают: при явном перевесе одного руководителя второй обычно отменяет уже оплаченные поставки."
 KOCH_PODIK.11016.t:0 "Контрдело Вамоса, том нулевой"
 KOCH_PODIK.11016.d:0 "Гамос обвиняет Вамоса в монополизации права обвинять Гамоса. Приложен лист с подписью Вамоса; содержание листа не относится к предмету расследования.\n\nКанцелярия просит расширить полномочия Гамоса. Заводы просят не восстанавливать справедливость слишком резко: каждый перевес заканчивается отменой распоряжений и остановкой чужих проектов."
 KOCH_PODIK.11017.t:0 "Заседание перешло в партер"
 KOCH_PODIK.11017.d:0 "Председатели использовали стол в непредусмотренном регламентом качестве. Вамос защищал проект. Гамос наносил поправки. Секретарь просит признать его отсутствующим задним числом.\n\nПоддержка одного усилит его влияние; раздача министерств вернёт баланс, но обойдётся бюджету немедленно. После этого Совет сможет выбрать окончательное устройство власти."
 KOCH_PODIK.11018.t:0 "Гродно найдено в адресной книге"
 KOCH_PODIK.11018.d:0 "МИД подтвердил существование Гродненской республики и президента Артура. Последнее письмо просит перестать поздравлять его с несуществующими праздниками.\n\nСлужители Подика предлагают духовную защиту соседа. Совет предпочёл бы комиссию с четырьмя сопредседателями. Оба подхода требуют решить, дружим ли мы с Артуром или посвятим следующие месяцы официальному выяснению отношений."
 KOCH_PODIK.11019.t:0 "Особый объект государственной охраны"
 KOCH_PODIK.11019.d:0 "Проект охраны туза Артура включает караул, дипломатические привилегии и запрет объяснять школьникам, чем занимается служба. Сам Артур ещё не согласился.\n\nКульт готов освятить охрану, Совет — разделить полномочия. Отправим предложение президенту Гродно. Его ответ определит, можно ли перейти к договорам взаимной защиты."
 KOCH_PODIK.11020.t:0 "Саммит закончился без потерпевших"
 KOCH_PODIK.11020.d:0 "Артур принял делегацию. Переговоры начались с вопроса, кто разрешил поставить стол у его подъезда. После разъяснений стороны перешли к производству и безопасности.\n\nГродно согласилось на хозяйственную программу. Это ещё не союз, но уже документ, который обе стороны подписали осознанно. Делегация должна вернуться домой со всеми выданными ей флагами."
 KOCH_PODIK.11021.t:0 "Нота повышенной глубины"
 KOCH_PODIK.11021.d:0 "Гродно ответило на нашу озабоченность собственной. Если обмен продолжится, отношения провалятся ниже уровня международного права. Военные изучают карту и стараются не смеяться при слове туз.\n\nМожно ограничиться словами или усилить пограничную риторику. Второе поднимет поддержку войны, но добавит нервозности дома."
 KOCH_PODIK.11022.t:0 "Ультиматум требует адресата"
 KOCH_PODIK.11022.d:0 "Письмо требует прекратить обмен нотами и признать наши интересы. Требование вернуть степлер исключено как чрезмерное. Артур ещё не видел документ.\n\nОтправка запускает кризис: Гродно сможет уступить или отказаться. После отказа война останется отдельным решением. МИД допускает, что бумагу можно просто убрать в ящик и больше никому не показывать."
 KOCH_PODIK.11023.t:0 "Плановое обновление легитимности"
 KOCH_PODIK.11023.d:0 "Картридж заменён под надзором инженеров и духовенства. Старый экземпляр запечатан до выяснения, сохранились ли в нём государственные полномочия.\n\nКомиссия признала преемственность власти непрерывной. Счёт за обслуживание направлен в ведомство, которое утверждало, что вера не требует расходов."
 KOCH_PODIK.11024.t:0 "Подик отсутствует при исполнении"
 KOCH_PODIK.11024.d:0 "Святыня исчезла. Осталась записка: «Вернусь, когда вы научитесь заряжать». Почерк слишком разборчив для государственного служащего.\n\nПока устройство отсутствует, политический авторитет стремится к нулю. Можно объявить траур и начать розыск, обвинить оставшихся сторонников Совета или купить замену, убедив народ, что никто никуда не пропадал."
 KOCH_PODIK.11001.a:0 "Траур по здравому смыслу."
 KOCH_PODIK.11001.b:0 "Приобщить Совет к материалам дела."
 KOCH_PODIK.11002.a:0 "Начать летоисчисление. Чек не выбрасывать."
 KOCH_PODIK.11003.a:0 "Верховная власть помещается в карман."
 KOCH_PODIK.11004.a:0 "Выдать две печати. Убрать острые предметы."
 KOCH_PODIK.11005.a:0 "Единство достигнуто. Всем по домам."
 KOCH_PODIK.11005.b:0 "Повторить за государственный счёт."
 KOCH_PODIK.11006.a:0 "Подключить. Инженера оставить в штате."
 KOCH_PODIK.11006.b:0 "Сперва вручить папку благодарностей."
 KOCH_PODIK.11007.a:0 "Экстренно оплатить зарядку."
 KOCH_PODIK.11007.b:0 "Передать вопрос профильному ведомству."
 KOCH_PODIK.11008.a:0 "Признать пророка."
 KOCH_PODIK.11008.b:0 "Предъявите скриншот откровения."
 KOCH_PODIK.11008.c:0 "Назначить министром энергетики."
 KOCH_PODIK.11009.a:0 "Империя начинается с исправного обоза."
 KOCH_PODIK.11010.a:0 "Верховная власть заряжается."
 KOCH_PODIK.11011.a:0 "Вамосу зелёный свет."
 KOCH_PODIK.11011.b:0 "Слово Гамосу. Только коротко."
 KOCH_PODIK.11012.a:0 "Предусмотрительность достойна поддержки."
 KOCH_PODIK.11012.b:0 "Пусть Вамос сначала напишет предложение."
 KOCH_PODIK.11013.a:0 "Выдать лаборатории самостоятельность."
 KOCH_PODIK.11014.a:0 "Спрятать оригинал."
 KOCH_PODIK.11014.b:0 "Объявить разъяснительные слушания."
 KOCH_PODIK.11015.a:0 "Дать делу ход."
 KOCH_PODIK.11016.a:0 "Дать Гамосу восстановить справедливость."
 KOCH_PODIK.11017.a:0 "Вамос действовал в рамках инициативы."
 KOCH_PODIK.11017.b:0 "Гамос имел право на поправку."
 KOCH_PODIK.11017.c:0 "По министерству каждому. Стол в ремонт."
 KOCH_PODIK.11018.a:0 "Без четырёх сопредседателей."
 KOCH_PODIK.11019.a:0 "Уверить, что туз в безопасности."
 KOCH_PODIK.11019.b:0 "Увеличить финансирование охраны."
 KOCH_PODIK.11019.c:0 "Объявить объект международного значения."
 KOCH_PODIK.11020.a:0 "Редкий успех. Сохранить оригинал."
 KOCH_PODIK.11021.a:0 "Оставить спор на бумаге."
 KOCH_PODIK.11021.b:0 "Пусть патрули выглядят убедительнее."
 KOCH_PODIK.11022.a:0 "Доставить под подпись."
 KOCH_PODIK.11022.b:0 "Отозвать, пока это ещё письмо."
 KOCH_PODIK.11023.a:0 "История снова заряжается."
 KOCH_PODIK.11024.a:0 "Траур. Поисковую группу — на выезд."
 KOCH_PODIK.11024.b:0 "Обвинить остатки Совета."
 koch_podik_cult:0 "Обслуживание вечности"
 koch_podik_cult_desc:0 "Заряд священного Подика: §Y[?KOCH_podik_charge|1]%§!.\nСостояние: [KOCH_B11_GetChargeStatus].\nРежим: [KOCH_B11_GetChargeMode]. Расход: §Y[?KOCH_podik_daily_drain|1]§! п./сутки.\n[KOCH_B11_GetChargeForecast]\nОбслуживание: [KOCH_B11_GetChargeService].\nБазовый расход — 0,5 в сутки; с инструкцией — 0,3. Война добавляет 0,2, экономрежим убирает 0,2 (минимум 0,1). Во время зарядки расход приостановлен."
 koch_podik_council:0 "Два председателя, один бюджет"
 koch_podik_council_desc:0 "Вамос: §Y[?KOCH_vamos_influence|0]%§!. Гамос: §Y[?KOCH_gamos_influence|0]%§!.\nВлияние в сумме равно 100. При 75% и выше обиженный коллега раз в месяц может саботировать производство. Компромисс и единоличная власть прекращают эту борьбу; двоевластие сохраняет её."
 koch_podik_diplomacy:0 "Тузовая дипломатия"
 koch_podik_diplomacy_desc:0 "Предложения отправляются Артуру: он может согласиться или отказать. Союз создаётся с согласия обеих стран. Ультиматум даёт выбор между переговорами и военной целью; война автоматически не начинается."
 koch_podik_government:0 "Государственные инициативы"
 koch_podik_government_desc:0 "Промышленные программы зависят от политического курса. Финальный строй открывает собственные решения: имперское снабжение, священные собрания, гражданские контракты, распоряжения председателя или смены двух президентов."
 KOCH_B11_charge_ritual_desc:0 "За 20 политической власти святыню подключат на три дня: +20 пунктов в сутки, после инструкции +30. Во время зарядки расход приостанавливается. Новую ручную зарядку можно заказать через 21 день; при 100% процесс заканчивается досрочно."
 KOCH_B11_public_litany_desc:0 "Публичная церемония требует 40 политической власти и 10 пунктов заряда. Участники обретут уверенность; устройство приобретёт ещё один повод попросить отпуск."
 KOCH_B11_replace_cartridge_desc:0 "Срочная замена за 60 политической власти немедленно восстановит заряд до 100%. Это дорогой аварийный выход, когда нет трёх дней на обычную зарядку. Сломанный или пропавший Подик замена картриджа не вернёт."
 KOCH_B11_repair_device:0 "Гарантийный ремонт святыни"
 KOCH_B11_repair_device_desc:0 "Инженеру выдадут отвёртку, пропуск и справку, что вскрытие корпуса не считается богохульством. Ремонт восстанавливает 60 пунктов заряда."
 KOCH_B11_find_device:0 "Розыск государственного имущества"
 KOCH_B11_find_device_desc:0 "Поисковую группу возглавит человек, который умеет искать вещи, а не виноватых. Результат станет известен через две недели."
 KOCH_B11_hear_mark_again:0 "Заказать повторное откровение"
 KOCH_B11_hear_mark_again_desc:0 "Марк готов снова поговорить с картриджем. На этот раз протокол заседания будет вести человек без привычки задавать вопросы."
 KOCH_B11_holy_assembly:0 "Собор согласных граждан"
 KOCH_B11_holy_assembly_desc:0 "Теократический финал позволяет провести священное собрание. Оно даст временную поддержку режиму, но потребует заряда и содержания делегаций."
 KOCH_B11_back_vamos_desc:0 "Влияние Вамоса увеличится на 10, влияние Гамоса уменьшится на столько же. Повторная поддержка продолжает менять баланс; при перевесе возможен саботаж."
 KOCH_B11_back_gamos_desc:0 "Влияние Гамоса увеличится на 10 за счёт Вамоса. Микрофоны в кабинете по-прежнему два, но один начнёт включаться раньше."
 KOCH_B11_emergency_vote_desc:0 "Оплатим обоим председателям одинаковые министерские вывески. Баланс вернётся к 50/50, саботаж прекратится. Обсуждать счёт за вывески запрещается."
 KOCH_B11_council_tender:0 "Тендер на два одинаковых завода"
 KOCH_B11_council_tender_desc:0 "После создания ведомства бессмысленных решений Совет может выдавать производственные контракты. Предприятия получат временные бонусы; председатели — возможность спорить об авторстве."
 KOCH_B11_send_ace_guard_desc:0 "Артур получит новое официальное предложение. Его согласие откроет дальнейшие договоры; отказ оставит возможность повторить переговоры через 90 дней."
 KOCH_B11_retry_alliance:0 "Ещё один экземпляр союзного договора"
 KOCH_B11_retry_alliance_desc:0 "Повторим предложение о союзе. Артур принимает решение сам. Страны должны быть независимы; Гродно не должно уже состоять в другом альянсе."
 KOCH_B11_issue_ultimatum_desc:0 "Письмо будет доставлено лично. Артур может принять требования или отказаться. Отказ откроет выбор военной цели; автоматического объявления войны не будет."
 KOCH_B11_border_mediation:0 "Отвести патрули к чайнику"
 KOCH_B11_border_mediation_desc:0 "После конфронтации можно остановить кризис. Потеряем немного воинственного пыла, восстановим отношения и закроем текущий спор."
 KOCH_B11_authorize_wargoal:0 "Выдать военный мандат"
 KOCH_B11_authorize_wargoal_desc:0 "После отказа Артура правительство может получить цель войны. Мандат не запускает войну: объявлять её или продолжать переговоры решает игрок."
 KOCH_B11_civil_compromise:0 "Пусть строители решат сами"
 KOCH_B11_civil_compromise_desc:0 "Компромиссный финал передаёт исполнение контрактов специалистам. Гражданское строительство ускорится на 120 дней; через полгода можно продлить программу."
 KOCH_B11_chair_order:0 "Одна подпись — одна смена"
 KOCH_B11_chair_order_desc:0 "Единственный председатель может издать распоряжение о дополнительной производственной смене. Военное производство получит временный бонус."
 KOCH_B11_dual_shift:0 "Президентская смена караула"
 KOCH_B11_dual_shift_desc:0 "Два президента официально разделят рабочий день. Даст временные бонусы исследованиям и выпуску продукции, но перевес одного председателя всё ещё может вызвать саботаж."
 KOCH_B11_imperial_supply:0 "Имперский обоз из райцентра"
 KOCH_B11_imperial_supply_desc:0 "Имперский финал позволяет снабдить военную кампанию резервистами и подготовить офицеров. Разрешено только во время войны; государству всё ещё приходится платить за собственные амбиции."
 KOCH_B11_imperial_mandate:0 "Мандат на спасение соседей"
 KOCH_B11_imperial_mandate_desc:0 "Выберите соседнее независимое государство вне нашего союза. Цель войны станет доступна после подготовки мандата. Дружественное Гродно исключено из этой программы."
 KOCH_PODIK.11001.c:0 "Свернуть розыск. Сохранить чек."
 KOCH_PODIK.11007.c:0 "Проценты арестовать."
 KOCH_PODIK.11013.b:0 "Передать находки заводам."
 KOCH_PODIK.11015.b:0 "Архивировать вместе с фотографом."
 KOCH_PODIK.11016.b:0 "Вернуть обвинение на доработку."
 KOCH_PODIK.11024.c:0 "Купить новый. Объявить старый слухом."
 KOCH_PODIK.11025.t:0 "Золотой век. До следующей розетки"
 KOCH_PODIK.11025.d:0 "Индикатор показывает не менее девяноста процентов. Газеты объявили невиданный расцвет цивилизации. Электрик просит не вынимать вилку ради торжественного фото.\n\nПока заряд остаётся выше 89%, страна получает бонусы золотого века. Запас конечен: история снова зависит от человека с удлинителем."
 KOCH_PODIK.11025.a:0 "Электрика к награде. Удлинитель к охране."
 KOCH_PODIK.11026.t:0 "Ваш туз предлагается взять под охрану"
 KOCH_PODIK.11026.d:0 "Из Подиковой республики прибыло предложение охранять туз президента Артура. В приложении — смета, караульный устав и совершенно ненужный чертёж. Канцелярия не уверена, что это дипломатия, но печать настоящая.\n\nСогласие позволит соседям организовать охрану и предложить взаимную защиту. Отказ оставит их с вооружённым караулом, которому ещё предстоит объяснить, что рабочее место не согласовано."
 KOCH_PODIK.11026.a:0 "Ладно. Но без чертежа."
 KOCH_PODIK.11026.b:0 "Мой туз справляется самостоятельно."
 KOCH_PODIK.11027.t:0 "Артур дал добро. Юристы побледнели"
 KOCH_PODIK.11027.d:0 "Гродно согласилось на охрану. Караул получает маршрут, МИД — редкое чувство полезности, Артур — возможность задавать неудобные вопросы соседнему бюджету.\n\nТеперь договоры о братстве и общей безопасности можно обсуждать с согласия принимающей стороны. Туз охраняется по всем правилам международного недоразумения."
 KOCH_PODIK.11027.a:0 "Пост принят. Шутки оставить за периметром."
 KOCH_PODIK.11028.t:0 "Пост не принят"
 KOCH_PODIK.11028.d:0 "Артур отказал охране. В ответ на торжественную речь он указал на дверь. Караул принял её под наблюдение до прибытия автобуса.\n\nБез согласия Гродно охранная служба не создаётся. Можно вернуться к переговорам через решение: дипломатия измеряется не числом караульных, а числом принятых предложений."
 KOCH_PODIK.11028.a:0 "Автобус подать без оркестра."
 KOCH_PODIK.11029.t:0 "Делегация заняла подъезд"
 KOCH_PODIK.11029.d:0 "Соседи предлагают Артуру саммит: стол уже привезли, повестку ещё согласуют. В ней хозяйственная программа, совместное снабжение и пункт «не трогать чужие флаги».\n\nПринятие даст обеим странам временный торговый бонус. Отказ сэкономит время на объяснении, почему глава государства не обязан фотографироваться с каждым столом."
 KOCH_PODIK.11029.a:0 "Поставьте стол ровно. Начинаем."
 KOCH_PODIK.11029.b:0 "Саммит перенесён за пределы подъезда."
 KOCH_PODIK.11030.t:0 "Союзный договор с необычным названием"
 KOCH_PODIK.11030.d:0 "Подиковая республика предлагает Гродно военный союз. В преамбуле обещают взаимную безопасность; в названии сохранился туз. Канцелярия заверяет Артура, что название не влияет на боеспособность.\n\nСогласие создаст общий альянс, если страны независимы и свободны от несовместимых договоров. В противном случае останутся гарантии. Отказ не вызывает войны."
 KOCH_PODIK.11030.a:0 "Подписать. Название обсуждать после победы."
 KOCH_PODIK.11030.b:0 "Гарантии устроят. Союз подождёт."
 KOCH_PODIK.11031.t:0 "Два государства, общий повод для совещания"
 KOCH_PODIK.11031.d:0 "Союз оформлен. Штабы согласовали сигналы, дипломаты — порядок подписей, казначейства — взаимное недоверие к счетам. Артур просит не превращать совместные учения в публичный обряд.\n\nТеперь Гродно состоит с нами в одном альянсе. Дальнейшую войну и мир придётся обсуждать с настоящим союзником, у которого тоже есть мнение."
 KOCH_PODIK.11031.a:0 "Внести Артура в список тех, кого слушают."
 KOCH_PODIK.11032.t:0 "Артуру доставлено последнее предупреждение"
 KOCH_PODIK.11032.d:0 "Соседнее правительство требует признать его интересы и прекратить пограничный спор. Бумага подписана так крупно, словно подпись может заменить армию.\n\nАртур может уступить на словах и закрыть кризис либо отказаться. Отказ позволит соседям отдельно подготовить цель войны; боевые действия сами собой не начнутся."
 KOCH_PODIK.11032.a:0 "Признать интересы. Пусть подавятся формулировкой."
 KOCH_PODIK.11032.b:0 "Ответное письмо поместилось в одно слово."
 KOCH_PODIK.11033.t:0 "Победа над формулировкой"
 KOCH_PODIK.11033.d:0 "Артур признал наши интересы. Какие именно — в письме не указано. МИД считает отсутствие конкретики лучшим условием договора. Патрули возвращаются домой, пока кто-нибудь не попросил приложение.\n\nКризис закрыт без войны и передачи территории. Газеты могут печатать слово «победа»; картографам сегодня выходной."
 KOCH_PODIK.11033.a:0 "Мир помещается в папку."
 KOCH_PODIK.11034.t:0 "Ультиматум вернулся с замечанием"
 KOCH_PODIK.11034.d:0 "Артур отказал. Письмо вернулось с короткой резолюцией; архивист просит не зачитывать её по радио. Военные предлагают подготовить мандат, дипломаты — вымыть чашки и начать заново.\n\nВоенная цель доступна отдельным решением за политическую власть. Можно вместо этого немедленно начать примирение. Ни один вариант не объявляет войну автоматически."
 KOCH_PODIK.11034.a:0 "Подготовить бумаги для военного мандата."
 KOCH_PODIK.11034.b:0 "Поставить чайник. Убрать красный карандаш."
 KOCH_PODIK.11035.t:0 "Пограничный чай без приложения"
 KOCH_PODIK.11035.d:0 "Делегации согласились снизить напряжение. Патрули отведены от наиболее обидных указателей. МИД обещает временно пользоваться словами, которые помещаются в словарь приличий.\n\nТекущий спор закрывается, а пограничная горячка отступает. Артур пока не стал другом, но перестал получать письма, похожие на медицинский диагноз."
 KOCH_PODIK.11035.a:0 "Чашки вернуть по описи."
 KOCH_PODIK.11036.t:0 "Производство остановлено в знак согласования"
 KOCH_PODIK.11036.d:0 "Один председатель получил не менее трёх четвертей влияния. Второй ответил распоряжением временно не исполнять первое распоряжение. Заводы встали, соблюдая оба документа одновременно.\n\nМожно купить баланс 50/50 за 45 политической власти, переждать три месяца саботажа или уступить часть полномочий. Нерешённый перекос вызовет новый конфликт после окончания наказания."
 KOCH_PODIK.11036.a:0 "По одинаковой печати каждому."
 KOCH_PODIK.11036.b:0 "Пусть заводы докажут лояльность простоем."
 KOCH_PODIK.11036.c:0 "Вернуть обиженному часть полномочий."
 KOCH_PODIK.11037.t:0 "Верховная власть не включается"
 KOCH_PODIK.11037.d:0 "Подик сломался. Богословы считают это испытанием, инженер — неисправностью. Пресс-служба предлагает третий диагноз: профилактическое молчание.\n\nСрочный ремонт за 30 политической власти займёт три недели. Можно отложить работу и позже оплатить прямой ремонт через решения. Зарядка не заменит починку."
 KOCH_PODIK.11037.a:0 "Выдать инженеру доступ к божественному."
 KOCH_PODIK.11037.b:0 "Пусть пока молчит по богословским причинам."
 KOCH_PODIK.11038.t:0 "Премия за поиск пропавшей премии"
 KOCH_PODIK.11038.d:0 "Комиссия Совета обнаружила расход на комиссию, расследовавшую расходы первой комиссии. Деньги нашлись в третьей. Вамос требует отставки Гамоса; Гамос требует сначала назначить виновного приказом.\n\nМожно оплатить аудит или пережить месяц остановок, получив поддержку тех, кто считает любое расследование покушением на традицию."
 KOCH_PODIK.11038.a:0 "Аудитор дешевле четвёртой комиссии."
 KOCH_PODIK.11038.b:0 "Объявить расходы нематериальным наследием."
 KOCH_PODIK.11039.t:0 "Сомнение переведено в запрещённые вещества"
 KOCH_PODIK.11039.d:0 "Гражданам разрешено верить, радоваться и сообщать о чужом недостатке радости. Инструкция убрана из публичного доступа: в ней слишком много проверяемых утверждений.\n\nЗапрет укрепит мобилизационную риторику, но не уменьшит расход заряда. Электрическая сеть не читает постановлений."
 KOCH_PODIK.11039.a:0 "Вера не требует вопросов. Розетка требует."
 KOCH_PODIK.11040.t:0 "Дело о недостаточно убедительном индикаторе"
 KOCH_PODIK.11040.d:0 "Низкий заряд признан изменой. Следствие выясняет, кто именно изменил государству: пользователь, батарея или человек, выключивший свет. Обвиняемый удлинитель отказался от показаний.\n\nШтрафы дадут средства на экстренную зарядку. Показательная кампания даст поддержку войны ценой спокойствия граждан. Физика в обоих случаях продолжит действовать."
 KOCH_PODIK.11040.a:0 "Взыскать двадцать единиц политической воли."
 KOCH_PODIK.11040.b:0 "Объявить показательную охоту на разряд."
 KOCH_PODIK.11041.t:0 "Главного опять не нашли"
 KOCH_PODIK.11041.d:0 "На двери кабинета две таблички. Вамос снял нижнюю, Гамос перевесил верхнюю. Канцелярия предлагает сделать главного того, кто первым подпишет счета, но оба требуют уточнить должностные обязанности.\n\nПоддержка одного изменит влияние на десять пунктов. Платная рассадка вернёт равенство. Для единоличного финала одному председателю потребуется не менее 65% влияния."
 KOCH_PODIK.11041.a:0 "Ключи Вамосу."
 KOCH_PODIK.11041.b:0 "Табличку Гамосу."
 KOCH_PODIK.11041.c:0 "Заказать кабинет без главного кресла."
 KOCH_PODIK.11042.t:0 "Компромисс признан действительным"
 KOCH_PODIK.11042.d:0 "Вамос и Гамос подписали договор, запрещающий отменять решения друг друга ради удовольствия. Исполнение отдали специалистам. Специалисты попросили не рассказывать, где они живут.\n\nБорьба за влияние прекращается. Финальный строй открывает гражданские контракты: государство впервые получает шанс построить что-нибудь до очередной поправки."
 KOCH_PODIK.11042.a:0 "Печати в сейф. Строителей на площадку."
 KOCH_PODIK.11043.t:0 "Кресло осталось одно"
 KOCH_PODIK.11043.d:0 "[ROOT.GetLeader] занял единственное главное кресло. Второе передали в музей конституционной неопределённости. Посетителям запрещено проверять его устойчивость.\n\nСаботаж сопредседателя прекращается. Единоличная власть открывает военные производственные распоряжения. Ответственность за результаты впервые нельзя отправить в соседний кабинет."
 KOCH_PODIK.11043.a:0 "Одну подпись хотя бы можно разобрать."
 KOCH_PODIK.11044.t:0 "Два президента официально"
 KOCH_PODIK.11044.d:0 "Конституция признала то, с чем охрана боролась с первого дня: в кабинет входят сразу два президента. Теперь каждый уверен, что второй исполняет обязанности заместителя.\n\nПрезидентские смены дадут бонусы науке и выпуску продукции. Влияние продолжает меняться, а сильный перекос всё ещё вызывает саботаж. Два титула не заменили один регламент."
 KOCH_PODIK.11044.a:0 "Две инаугурации. Один счёт."
 KOCH_PODIK.11045.t:0 "Передовица прошла согласование"
 KOCH_PODIK.11045.d:0 "Газета готова к печати. Культ требует поставить Подик выше заголовка. Совет просит две первые полосы, чтобы не возникло ощущения предпочтения. Редактор просит бумагу и хотя бы один выходной.\n\nМожно настроить прессу на мобилизацию или позволить гражданам прочитать новости, после которых хочется спокойно работать."
 KOCH_PODIK.11045.a:0 "Каждый абзац — в строй."
 KOCH_PODIK.11045.b:0 "Напечатать прогноз погоды без угроз."
 KOCH_PODIK.11046.t:0 "Отчёт о состоявшемся государстве"
 KOCH_PODIK.11046.d:0 "Комиссия проверила республику и установила, что учреждения работают. Иногда даже по назначению. Статистика не объясняет, как мы дошли до этого места; архив просит не уничтожать доказательства.\n\nВыбранный политический строй сохраняется. Заряд или влияние, дипломатические решения и государственные программы продолжают действовать после завершения дерева."
 KOCH_PODIK.11046.a:0 "Подшить. Не начинать всё заново."
 KOCH_PODIK.11047.t:0 "Святыня возвращена в рабочее состояние"
 KOCH_PODIK.11047.d:0 "Поисковая группа и ремонтная мастерская предъявили исправный Подик. В акте написано: «Найден там, где ремонтировался». Комиссия решила, что подробности только навредят доверию.\n\nЕсли проблема ещё не решена, устройство возвращается с зарядом 60%. Если его успели заменить раньше, мастерская просто закроет заявку без нового вмешательства."
 KOCH_PODIK.11047.a:0 "Принять по акту. Мастера не канонизировать."
 KOCH_PODIK.11048.t:0 "Договор пока без альянса"
 KOCH_PODIK.11048.d:0 "Общий альянс не оформлен: Артур предпочёл гарантии либо существующие обязательства помешали вступлению. Папка с союзным договором остаётся в МИДе. Там уже выделили ей отдельную полку.\n\nВзаимные гарантии сохраняются при согласованной охране. Позже предложение о союзе можно повторить через решения, если страны независимы и свободны от несовместимых союзов."
 KOCH_PODIK.11048.a:0 "Полку не считать дипломатической победой."
 KOCH_B11_last_percent:0 "Государство на последнем проценте"
 KOCH_B11_last_percent_desc:0 "Кабинет ещё заседает, но протоколы уже печатают на обороте неоплаченных счетов. Политическая воля, доверие и строительный раствор подходят к концу."
 KOCH_B11_budget_crisis_desc:0 "Чрезвычайный бюджет требует всё больше товаров для населения и оставляет всё меньше средств строителям. Через 210 дней казначейство обязуется хотя бы перестать называть это временными трудностями."
 KOCH_B11_new_epoch_desc:0 "Покупка XROS 6 Mini объединила граждан вокруг события, которое точно состоялось: сохранился кассовый чек. У государства появился повод снова верить собственным заявлениям."
 KOCH_B11_podik_catechism_desc:0 "Единство укрепилось, но согласование государственных решений теперь включает богословскую экспертизу. Инженер просит оставить хотя бы один вопрос без священного толкования."
 KOCH_B11_sacred_cartridge_desc:0 "Учёные получили право изучать картридж без права называть его обычным предметом. Небольшой научный прогресс вполне совместим с большим количеством церемоний."
 KOCH_B11_charge_denial_desc:0 "Публикации сомнительных показаний запрещены. Режим получает поддержку воинственных сторонников, но тратит силы на поддержание обязательной уверенности."
 KOCH_B11_charge_treason_desc:0 "За последний процент будут держаться до конца. Страх перед обвинением повышает готовность сопротивляться капитуляции и снижает доверие к государству."
 KOCH_B11_evaporation_revolution_desc:0 "Армия получила новые наставления, где вдохновение наконец подкреплено тренировкой. Командиры научились отличать маскировку от торжественного дыма."
 KOCH_B11_mark_prophet_desc:0 "Марк П признан штатным толкователем воли святыни. Граждане обрели уверенность, а военные — благословение, которое хотя бы не требует отдельной накладной."
 KOCH_B11_podik_above_state_desc:0 "Учреждения обслуживают святыню под руководством Марка. Теократический порядок укрепляет власть и освобождает часть хозяйственных ресурсов от старой бюрократии."
 KOCH_B11_two_chairs_desc:0 "Совет научился собирать сторонников, но пока не научился собирать устойчивое правительство. Каждое кресло требует собственной канцелярии."
 KOCH_B11_split_power_desc:0 "Полномочия распределены между председателями. Решения принимаются чаще, а исследователи иногда успевают получить обе подписи до изменения проекта."
 KOCH_B11_great_compromise_desc:0 "Председатели прекратили взаимный саботаж и передали исполнение специалистам. Гражданское строительство и бюджет наконец получают понятные правила."
 KOCH_B11_single_chair_desc:0 "Один кабинет, одна подпись, один виновный. Политическая власть и военное производство больше не расходуются на борьбу сопредседателей."
 KOCH_B11_two_presidents_desc:0 "Официальное двоевластие помогает военному строительству и науке. Соперничество сохраняется: при 75% влияния один президент всё ещё способен сорвать работу другого."
 KOCH_B11_ace_guard_desc:0 "Артур согласился на особую охранную службу. Страна гордится международной миссией, описание которой караульным запрещено произносить с улыбкой."
 KOCH_B11_border_fever_desc:0 "Патрули готовы защищать каждую обидную формулировку. Воинственный пыл укрепляет оборону; посредничество или мирное завершение кризиса снимет эту горячку."
 KOCH_B11_logistics_desc:0 "У маршрутов появились диспетчеры, у складов — описи, у грузов — шанс прибыть по адресу. Потребление снабжения немного сокращено."
 KOCH_B11_golden_charge:0 "Золотой век: индикатор одобряет"
 KOCH_B11_golden_charge_desc:0 "Заряд не ниже 90% и устройство исправно. Доверие к режиму и строительство растут. Ниже 90% бонус исчезнет."
 KOCH_B11_brownout:0 "Верховная власть разряжается"
 KOCH_B11_brownout_desc:0 "Критический заряд, поломка или пропажа вызвали беспорядки, замедление строительства и падение авторитета. Исправный Подик с зарядом не ниже 40% восстановит порядок. На нуле обычный кризис заменяется усиленным штрафом отключения."
 KOCH_B11_council_sabotage:0 "Вето на работающие заводы"
 KOCH_B11_council_sabotage_desc:0 "Обиженная канцелярия тормозит производство и тратит политическую власть. Временный саботаж закончится сам, но при перекосе влияния не менее 75% конфликт может повториться."
 KOCH_B11_pilgrim_industry:0 "Паломники с производственным планом"
 KOCH_B11_pilgrim_industry_desc:0 "Культ научился отправлять делегации на стройку с инструментами. Гражданские предприятия и дороги строятся быстрее, хотя ввод в эксплуатацию по-прежнему требует торжественной речи."
 KOCH_B11_double_contracts:0 "Две подписи на одном станке"
 KOCH_B11_double_contracts_desc:0 "Совет подкрепил обещания производственными контрактами. Военные заводы ускоряют выпуск и освоение продукции; бухгалтерия просит не заказывать второй экземпляр уже купленного станка."
 KOCH_B11_fanatic_reserves:0 "Резерв по велению святыни"
 KOCH_B11_fanatic_reserves_desc:0 "Почитатели Подика пополняют мобилизационный резерв. Военкомат убедил добровольцев, что служба по расписанию полезнее стихийного шествия."
 KOCH_B11_imperial_authority:0 "Имперский мандат"
 KOCH_B11_imperial_authority_desc:0 "Империя готова готовить войны за пределами собственного бюджета. Расширены мобилизационный резерв и возможности экспансии; армия получила общий порядок подчинения."
 KOCH_B11_civil_contract:0 "Контракт без сопредседателя"
 KOCH_B11_civil_contract_desc:0 "Специалистам временно разрешено строить без новых политических поправок. Гражданское строительство ускорено на срок программы."
 KOCH_B11_war_contract:0 "Распоряжение единственного кресла"
 KOCH_B11_war_contract_desc:0 "Военные предприятия выполняют единый производственный приказ. Бонус действует временно; одна подпись всё ещё не заменяет сырьё."
 KOCH_B11_assembly_fervor:0 "Резолюция священного собрания"
 KOCH_B11_assembly_fervor_desc:0 "Делегаты выразили согласие с устройством государства и подтвердили его авторитет. Эффект собрания ограничен сроком: участникам всё равно придётся вернуться к работе."
 KOCH_B11_presidential_shifts:0 "Президенты работают посменно"
 KOCH_B11_presidential_shifts_desc:0 "Председатели поделили рабочий день вместо очередного раздела бюджета. Временно ускорены исследования и военное производство."
 KOCH_B11_recognized_state:0 "Государство принято по описи"
 KOCH_B11_recognized_state_desc:0 "Учреждения пережили реформы и научились исполнять достаточно обещаний, чтобы граждане снова им доверяли. Итоговую записку теперь можно предъявлять без сопровождающего объяснения."
 KOCH_B11_mark_energy:0 "Марк у энергетического щита"
 KOCH_B11_mark_energy_desc:0 "Марк направил откровения на развитие инфраструктуры. Инженеры готовы терпеть высокий стиль докладов, пока он согласует поставку кабеля."
 KOCH_B11_ace_trade:0 "Саммит с хозяйственным приложением"
 KOCH_B11_ace_trade_desc:0 "Гродно и Подиковая республика договорились о временной программе гражданского строительства. За общим столом неожиданно удалось согласовать полезный документ."
 KOCH_B11_council:0 "Совет Вамоса и Гамоса"
 KOCH_B11_vamos:0 "Вамос"
 KOCH_B11_gamos:0 "Гамос"
 KOCH_podik_custodian:0 "Хранитель государственного имущества"
 KOCH_podik_custodian_desc:0 "Марк П отвечает за предмет, вокруг которого теперь существует государство. Должностная инструкция запрещает терять оба."
 KOCH_podik_prophet:0 "Пророк по штатному расписанию"
 KOCH_podik_prophet_desc:0 "Откровения публикуются в установленном порядке и повышают готовность сторонников защищать режим."
 KOCH_PODIK_PARTY:0 "Служители XROS 6 Mini"
 KOCH_COUNCIL_PARTY:0 "Совет Вамоса и Гамоса"
 KOCH_ACES_FACTION:0 "Договор охраняемых тузов"
 KOCH_B11_QUEUE_MILITIA:0 "Народное ополчение очереди"
 KOCH_B11_QUEUE_DIVISION:0 "1-я дивизия «Кто последний?»"
 KOCH_podik_engineering_bonus:0 "Инструкция по обращению с чудом"
 KOCH_absurd_science_bonus:0 "Комиссия прикладного безумия"
 KOCH_podik_charge:0 "Заряд священного Подика"
 KOCH_vamos_influence:0 "Влияние Вамоса"
 KOCH_gamos_influence:0 "Влияние Гамоса"
 KOCH_guard_respected:0 "Согласованная охрана туза"
 KOCH_B11_purchase_tt:0 "Открываются решения обслуживания Подика. После новой эпохи предстоит выбрать культ или Совет."
 KOCH_B11_future_choice_tt:0 "Культ Подика и Совет Вамоса и Гамоса взаимоисключают друг друга. Дипломатия и хозяйственная ветка доступны обоим путям."
 KOCH_B11_council_tt:0 "Влияние начинается с 50/50 и всегда составляет в сумме 100. Перевес одного председателя не менее 75% вызывает ежемесячную проверку саботажа."
 KOCH_B11_low_charge_tt:0 "В решениях доступны трёхдневная зарядка и срочная замена. Беспорядки прекратятся при 40% заряда. При поломке или пропаже сначала требуется ремонт или розыск."
 KOCH_B11_manual_tt:0 "Ежедневный расход уменьшается с 0,5 до 0,3 пункта. Зарядка восстанавливает 30 пунктов в сутки вместо 20. Открывается автоматическая служба обслуживания."
 KOCH_B11_missing_tt:0 "В решениях доступен розыск: 25 политической власти и 14 дней. Обычная зарядка не вернёт отсутствующее устройство."
 KOCH_B11_repair_tt:0 "В решениях доступен немедленный ремонт за 60 политической власти с восстановлением заряда до 60%."
 KOCH_B11_guard_retry_tt:0 "Предложение об охране можно повторить через решения. Последующие договоры требуют согласия Артура."
 KOCH_B11_empire_tt:0 "Открываются имперское военное снабжение и мандаты на цели войны против независимых соседей вне нашего альянса. Дружественное Гродно исключено."
 KOCH_B11_holy_tt:0 "Открываются священные собрания с временными бонусами власти и стабильности. Заряд остаётся обязательной заботой режима."
 KOCH_B11_compromise_tt:0 "Борьба за влияние прекращается. Открываются временные программы гражданского строительства."
 KOCH_B11_single_tt:0 "Руководителем становится председатель с влиянием не менее 65%. Борьба за влияние прекращается; открываются военные производственные распоряжения."
 KOCH_B11_dual_tt:0 "Открываются президентские смены с бонусами исследованиям и производству. Влияние и опасность саботажа сохраняются."
 KOCH_B11_escalation_tt:0 "После отказа Артура можно отдельно получить цель войны через решения. Посредничество позволяет закрыть спор без войны."
 KOCH_B11_wargoal_tt:0 "После фокуса «Развод с видом на границу» решение за 75 политической власти даст цель войны. Объявление войны остаётся вашим выбором."
 KOCH_B11_prophet_tt:0 "Сначала признайте откровение Марка. При прежнем отказе доступно решение о повторном откровении."
