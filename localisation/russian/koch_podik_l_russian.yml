 KOCH_B11_charge_rules_tt:0 "От §Y90%§! заряда — золотой век; ниже §Y40%§! — предупреждение; ниже §Y20%§! — кризис; на §Y0%§! — отключение. После кризиса порядок восстановится при §Y40%§!."
 KOCH_B11_charge_35_tt:0 "Заряд Подика: §G+35§! пунктов (максимум 100%)."
 KOCH_B11_charge_55_tt:0 "Заряд Подика: §G+55§! пунктов (максимум 100%)."
 KOCH_B11_charge_100_tt:0 "Заряд Подика восстановится до §G100%§!."
 KOCH_B11_charge_60_tt:0 "Подик будет отремонтирован. Заряд восстановится до §G60%§!."
 KOCH_B11_charge_cost_10_tt:0 "Будет потрачено §Y10§! пунктов заряда Подика."
 KOCH_B11_charge_cost_15_tt:0 "Будет потрачено §Y15§! пунктов заряда Подика."
 KOCH_PODIK.11049.t:0 "Индикатор просит аудиенции"
 KOCH_PODIK.11049.d:0 "Заряд опустился ниже сорока процентов. Министерство правды ещё не придумало красивое объяснение, зато дежурный электрик уже нашёл розетку. До настоящего кризиса остаётся время.\n\nМожно начать трёхдневную зарядку за 20 политической власти, сократить число церемоний экономрежимом за 10 или продолжать наблюдение. Расход и прогноз до критической отметки видны в разделе обслуживания Подика."
 KOCH_PODIK.11049.a:0 "Три дня без выездных откровений."
 KOCH_PODIK.11049.b:0 "Выключить декоративное бессмертие."
 KOCH_PODIK.11049.c:0 "Пока наблюдаем. Электрика не отпускать."
 KOCH_PODIK.11050.t:0 "Верховная власть выключилась"
 KOCH_PODIK.11050.d:0 "Подик сел до нуля. На площади молчат: впервые государственное обращение невозможно отличить от неисправности. Пресс-служба объявила паузу исторически значимой. Электрик объявил, что предупреждал.\n\nПолное отключение даёт более сильный штраф вместо обычных беспорядков. Начать зарядку можно прямо сейчас; когда заряд станет положительным, останется обычный кризис, а при 40% восстановится порядок."
 KOCH_PODIK.11050.a:0 "Принести кабель. Протокол составим потом."
 KOCH_PODIK.11050.b:0 "Объявить молчание программной речью."
