l_russian:
 KOCH_B11_LAST_SENSE:0 "Последняя затяжка здравого смысла"
 KOCH_B11_LAST_SENSE_desc:0 "На первом заседании года министр финансов попросил выключить свет: так бюджет выглядит лучше. Министр обороны предложил выключить карту. Пока кабинет не добрался до населения, следует собрать остатки государственной воли и выяснить, кто вообще уполномочен подписывать эту хрень."
 KOCH_B11_WHERE_PODIK:0 "Где подик, господа министры?"
 KOCH_B11_WHERE_PODIK_desc:0 "При инвентаризации президентского кабинета обнаружено отсутствие предмета, вокруг которого все обычно стояли. Без него совещание выглядит как восемь безработных возле тумбочки. Начать розыск. Проверить карманы, сейфы и министра, который слишком уверенно говорит, что он не в курсе."
 KOCH_B11_EMERGENCY_LIQUID:0 "Кабинет на сухом остатке"
 KOCH_B11_EMERGENCY_LIQUID_desc:0 "Правительство собралось на чрезвычайное заседание по вопросам жижи. Повестка включает три пункта: где взять, чем заплатить и почему министр сельского хозяйства уже добавил её в прогноз урожайности. Протокол поручено вести единственному человеку, который пока понимает разницу между жидкостью и ликвидностью."
 KOCH_B11_ONE_CARTRIDGE_BUDGET:0 "Казна на донышке"
 KOCH_B11_ONE_CARTRIDGE_BUDGET_desc:0 "После выплаты жалованья бухгалтеру в казне осталось ровно на один картридж. Бухгалтер предлагает вернуть жалованье, но деньги уже украл министр антикоррупции. Придётся затянуть пояса, перенести государственные расходы на потом и официально признать потом следующим финансовым годом."
 KOCH_B11_BUY_XROS:0 "Купить XROS 6 Mini"
 KOCH_B11_BUY_XROS_desc:0 "Служба государственных закупок выбрала Vaporesso XROS 6 Mini. Конкурирующая заявка на ремонт больницы отклонена: у больницы нет сменного картриджа. Казначейство перечислит деньги, делегация получит чек, а почётный караул впервые в истории встретит посылку, которая весит меньше его зарплатной ведомости."
 KOCH_B11_NEW_EPOCH:0 "Нулевой год Подика"
 KOCH_B11_NEW_EPOCH_desc:0 "Подик приобретён. История разделилась на до и после. Министерство образования срочно исправляет учебники: раньше цивилизации изобретали колесо, теперь они просто тянули время. Открываем новую эпоху с полным зарядом и прежним правительством. Вторую проблему пока решено не замечать."
 KOCH_B11_PODIK_PATH:0 "Священный путь Подика"
 KOCH_B11_PODIK_PATH_desc:0 "У человека есть сомнения, амбиции и родственники, которым нужны должности. У XROS 6 Mini ничего этого нет. Следовательно, он лучше подготовлен к государственному управлению. Признать молчание устройства высшей формой политической мудрости и закрыть вопрос о том, кто здесь главный."
 KOCH_B11_COUNCIL_PATH:0 "Совет Вамоса и Гамоса"
 KOCH_B11_COUNCIL_PATH_desc:0 "Вамос и Гамос предлагают спасти республику от власти бытовой электроники. Вместо одного безмолвного устройства страна получит двух руководителей, которые не затыкаются. Первый обещает движение вперёд, второй гарантирует тщательную проверку того, куда это первый собрался."
 KOCH_B11_PODIK_EVERYTHING:0 "Подик — наше всё"
 KOCH_B11_PODIK_EVERYTHING_desc:0 "Герб, флаг и гимн признаны вспомогательными принадлежностями к Подику. Государственная измена теперь начинается с фразы «да это просто штука». Гражданам станет спокойнее: наконец появилась национальная идея, которую можно показать пальцем, и почти никто не спрашивает, почему она лежит на салфетке."
 KOCH_B11_MASS_WORSHIP:0 "Явка на поклон — 146%"
 KOCH_B11_MASS_WORSHIP_desc:0 "Перепись выявила больше верующих, чем жителей. Комиссия объясняет расхождение высокой духовной плотностью населения. Массовое поклонение XROS 6 Mini пройдёт во всех населённых пунктах; отсутствующих граждан представят их заявления, заранее написанные участковым."
 KOCH_B11_SACRED_CARTRIDGE:0 "Мощи с гарантией"
 KOCH_B11_SACRED_CARTRIDGE_desc:0 "Картридж извлекут из устройства под надзором духовенства и инженера по технике безопасности. Первый объявит его реликвией, второй попросит не ронять. Для изучения священного предмета выделим лабораторию: химический состав откровения представляет несомненный промышленный интерес."
 KOCH_B11_MINISTRY_VAPOR:0 "Министерство жижи и пара"
 KOCH_B11_MINISTRY_VAPOR_desc:0 "Новый министр запросил кафедральный собор, личную охрану и небольшой завод. Собор временно заменят проходной, охрану — вахтёром, а завод действительно построят. Обнаружено редкое свойство государственной религии: иногда для её обслуживания приходится делать полезные вещи."
 KOCH_B11_ONE_PEOPLE_ONE_PODIK:0 "Один народ, один Подик"
 KOCH_B11_ONE_PEOPLE_ONE_PODIK_desc:0 "Во избежание раскола все граждане обязаны почитать одно устройство в одном месте. Очередь за национальным единством расписана до осени. Опоздавшим выдадут справку, что они мысленно присутствовали, а недовольным объяснят: вы хотя бы видели, какая очередь была при старой власти?"
 KOCH_B11_FIRST_FIVE_YEAR:0 "Пятилетка до обеда"
 KOCH_B11_FIRST_FIVE_YEAR_desc:0 "План требует построить дороги, расширить производство и доложить об успехах до того, как Подик разрядится. Инженеры потребовали нормальные сроки. Им выделили дополнительные часы на настенных часах. Несмотря на это, часть предприятий действительно заработает: инженеры умеют мстить начальству качеством работы."
 KOCH_B11_BAN_DOUBT:0 "Процентам верить запрещено"
 KOCH_B11_BAN_DOUBT_desc:0 "Прибор показывает снижение заряда. Министерство правды сообщает о росте оставшегося потенциала разрядки. Публикация цифр без богословского комментария запрещается. В официальной статистике у Подика всегда сто процентов; недостающая часть временно находится в стратегическом резерве."
 KOCH_B11_PILGRIMAGE_CHARGER:0 "Все дороги ведут к розетке"
 KOCH_B11_PILGRIMAGE_CHARGER_desc:0 "Святыня требует питания, а ближайшая исправная розетка находится в сорока километрах от столицы. Паломничество объявим испытанием веры. Генеральный штаб займётся маршрутом и снабжением: если он справится с доставкой удлинителя, можно будет доверить ему армию."
 KOCH_B11_SACRED_MANUAL:0 "Евангелие от техподдержки"
 KOCH_B11_SACRED_MANUAL_desc:0 "В коробке обнаружена инструкция. Марк П требует признать её древним пророчеством, хотя на обороте указан действующий телефон сервисного центра. Перевод поручим инженерам. Они уже нашли откровение, способное изменить нашу промышленность: прежде чем чинить прибор, его нужно отключить от сети."
 KOCH_B11_EMPTY_TREASON:0 "Ноль процентов — высшая мера"
 KOCH_B11_EMPTY_TREASON_desc:0 "Следствие установило: заряд убывал систематически, ночью и без согласования с президентом. Это уже не неисправность, а организованная деятельность. Введём ответственность за разрядку святыни. Судить устройство нельзя, поэтому обвиняемым назначат того, кто последним сказал, что всё работает."
 KOCH_B11_EVAPORATION_REVOLUTION:0 "Революция без проветривания"
 KOCH_B11_EVAPORATION_REVOLUTION_desc:0 "На площади столько священного пара, что правительство потеряло народ из виду. Генеральный штаб назвал это успешной маскировкой. Развернём испарительную революцию: вдохновлённые части получат новые наставления, а святыню наконец зарядят, пока пророки заняты митингом."
 KOCH_B11_MARK_HEARS_CARTRIDGE:0 "Картридж вызвал Марка"
 KOCH_B11_MARK_HEARS_CARTRIDGE_desc:0 "Марк П прервал заседание и сообщил, что картридж заговорил. По его словам, святыня потребовала расширить полномочия Марка П. Совпадение признано чудом. Кабинету предстоит решить, как оформлять откровения: отдельным постановлением или сразу штатным расписанием."
 KOCH_B11_MARK_PROPHET:0 "Пророк на полной ставке"
 KOCH_B11_MARK_PROPHET_desc:0 "До сих пор Марк П пророчествовал в свободное от управления страной время. Это недопустимое совмещение. Учредим должность государственного пророка с окладом, отпуском и правом не отвечать на уточняющие вопросы. Каждое сбывшееся пророчество будет публиковаться задним числом. Для назначения потребуется признать откровение Марка; при отказе можно заказать повторное."
 KOCH_B11_ETERNAL_EMPIRE:0 "Вечная Подиковая империя"
 KOCH_B11_ETERNAL_EMPIRE_desc:0 "Республика слишком мала для предмета всемирного значения. Картографам поручено отметить земли, жители которых ещё не знают, что нуждаются в нашем спасении. Независимым соседям вне нашего союза приготовят имперские мандаты; дружественное Гродно из списка исключено. Империя будет вечной; срок службы аккумулятора вынесен в секретное приложение."
 KOCH_B11_PODIK_ABOVE_STATE:0 "Подик выше государства"
 KOCH_B11_PODIK_ABOVE_STATE_desc:0 "Парламент совещается, суд сомневается, казначейство считает. Подик молчит и потому ни разу публично не ошибся. Передадим ему верховную власть, оставив учреждениям обслуживание святыни. На выборах останется один вопрос: согласны ли вы с тем, что индикатор светится?"
 KOCH_B11_TWO_CHAIRS:0 "Два стула — один Совет"
 KOCH_B11_TWO_CHAIRS_desc:0 "Для совместного правления заказали два одинаковых кресла. Вамос обнаружил, что кресло Гамоса ближе к окну. Гамос заметил, что кресло Вамоса ближе к бюджету. Организация власти начнётся с перестановки мебели и назначения ответственного за расстояние между стульями."
 KOCH_B11_VAMOS_SAID:0 "Вамос сказал Vamos"
 KOCH_B11_VAMOS_SAID_desc:0 "Вамос предлагает двигаться. Куда именно, станет понятно в процессе, а обсуждение маршрута только помогает врагам движения. Одобрим его программу: граждане услышат, что власть наконец действует, и на некоторое время перестанут уточнять, в каком направлении."
 KOCH_B11_GAMOS_AGAINST:0 "Гамос против заранее"
 KOCH_B11_GAMOS_AGAINST_desc:0 "Гамос подготовил возражение ещё до получения предложения. Это выдающаяся административная предусмотрительность. Передадим ему право предварительного несогласия: пока Вамос разгоняет государство, кто-то должен хотя бы проверить, прикручены ли колёса."
 KOCH_B11_SPLIT_POWER:0 "Власть распилить вдоль"
 KOCH_B11_SPLIT_POWER_desc:0 "Бюджет пополам, кабинет пополам, печать пополам. Документы, заверенные половиной печати, будут действовать через день. Чиновники надеются работать вдвое меньше, но получат двух начальников. Зато любой проект теперь можно продвигать, пока второй председатель обедает."
 KOCH_B11_MINISTRY_NONDECISIONS:0 "Ведомство «Потом разберёмся»"
 KOCH_B11_MINISTRY_NONDECISIONS_desc:0 "Каждый спорный вопрос будет передаваться в новое министерство до выяснения обстоятельств. Для обстоятельств выделят отдельный архив. Совет освободится от текущих проблем, а граждане впервые получат честный официальный ответ на запрос: ваше обращение успешно пережило ещё один рабочий день."
 KOCH_B11_COMMISSION_COMMISSION:0 "Комиссия по комиссиям"
 KOCH_B11_COMMISSION_COMMISSION_desc:0 "Первая комиссия ничего не нашла. Вторая установила, что первая искала не там. Третья предлагает изучить саму возможность поиска. Научим эту систему приносить пользу: пригласим исследователей, которым хотя бы интересно, почему всё работает настолько через жопу."
 KOCH_B11_WHO_IS_BOSS:0 "Кто здесь самый временный?"
 KOCH_B11_WHO_IS_BOSS_desc:0 "Каждый председатель считает коллегу временной мерой. Чтобы прекратить споры, поручим обоим представить доказательства собственной незаменимости. Победит тот, чья папка толще. Государственный архив уже просит эвакуацию, а типография — дополнительную смену."
 KOCH_B11_NAPKIN_CONSTITUTION:0 "Конституция с пятном борща"
 KOCH_B11_NAPKIN_CONSTITUTION_desc:0 "Основной закон написан на салфетке во время рабочего обеда. Пятно перекрывает статью о передаче власти, зато раздел о президентском довольствии читается прекрасно. Ратифицируем документ, пока официант не убрал со стола единственную юридическую гарантию существования республики."
 KOCH_B11_BAN_OUR_OPPOSITION:0 "Самих себя — под запрет"
 KOCH_B11_BAN_OUR_OPPOSITION_desc:0 "Вамос запрещает сторонников Гамоса, Гамос запрещает сторонников Вамоса. Оба являются членами одного Совета. Юристы предлагают остановиться, но уже подпадают под оба запрета. Оформим общую победу над оппозицией; кому теперь подписывать распоряжения, решим после торжественного заседания."
 KOCH_B11_VAMOS_BLAMES:0 "Дело о вредительстве Гамоса"
 KOCH_B11_VAMOS_BLAMES_desc:0 "Вамос представил доказательства саботажа: Гамос не поддержал его предложение, потому что прочитал его. Назначим это обстоятельство отягчающим. Следствие должно установить, кто разрешил председателю знакомиться с документами до подписания и сколько ещё решений он успел испортить пониманием."
 KOCH_B11_GAMOS_BLAMES:0 "Вамос, это всё ты"
 KOCH_B11_GAMOS_BLAMES_desc:0 "Гамос обнаружил подпись Вамоса на каждом неудачном постановлении. На удачных его подпись тоже есть, но это не относится к делу. Откроем встречное расследование и изымем у коллеги канцелярию. Победа над шариковой ручкой станет первым шагом к восстановлению законности."
 KOCH_B11_TWO_PERSON_CONGRESS:0 "Съезд: оба на месте"
 KOCH_B11_TWO_PERSON_CONGRESS_desc:0 "На съезд прибыли все делегаты. Кворум установлен визуально. Вамос требует большинства, Гамос требует пересчёта, секретарь предлагает больше никогда не работать в политике. Пора принять общую резолюцию, хотя бы о том, где провести следующий съезд двух человек."
 KOCH_B11_COUNCIL_CRISIS:0 "Бюджет пошёл в рукопашную"
 KOCH_B11_COUNCIL_CRISIS_desc:0 "Во время обсуждения расходов Вамос перешёл на личности, Гамос — на физический контакт. Стенографист успел записать только первые два удара. Государству нужен выход из кризиса: соглашение, единоличная власть или такой порядок, при котором руководителей перестанут сажать за один стол."
 KOCH_B11_GREAT_COMPROMISE:0 "Великий компромисс"
 KOCH_B11_GREAT_COMPROMISE_desc:0 "Вамос управляет по чётным дням, Гамос по нечётным, а ночью решения исполняют специалисты. Если день объявлен праздничным, спорить запрещено. После долгих переговоров Совет открыл невероятный секрет: государство приносит больше пользы, когда оба руководителя одновременно отдыхают. Примирение прекратит борьбу влияний и откроет гражданские контракты."
 KOCH_B11_SINGLE_CHAIR:0 "Единственный председатель"
 KOCH_B11_SINGLE_CHAIR_desc:0 "Второй стул признан источником политической нестабильности и выведен за штат. С ним уходит право бесконечного возражения. Оставшийся председатель получит всю полноту власти, включая неудобную обязанность объяснять собственные провалы без ссылки на коллегу. Его уже спрашивают, нельзя ли стул вернуть. Кресло достанется председателю, набравшему не менее 65% влияния."
 KOCH_B11_TWO_PRESIDENTS:0 "Государство двух президентов"
 KOCH_B11_TWO_PRESIDENTS_desc:0 "Введём две президентские канцелярии, два обращения к народу и две торжественные клятвы. Каждая половина страны будет знать, кто за неё отвечает. При мобилизации фамилии распределят по алфавиту; лиц с двойной фамилией убедительно просят не провоцировать конституционный кризис. Президентские смены усилят науку и производство, однако риск взаимного саботажа останется."
 KOCH_B11_DIPLOMATIC_ARGUMENT:0 "Артур: сосед или статья расходов?"
 KOCH_B11_DIPLOMATIC_ARGUMENT_desc:0 "МИД обнаружил Гродненскую республику и немедленно разделился на две школы мысли: дружить с Артуром или официально с ним не дружить. Поклонники Подика предлагают духовное покровительство, Совет — двустороннюю комиссию. Сам Артур пока надеется, что это просто рекламная рассылка."
 KOCH_B11_RELATIONS_GRODNO:0 "Посол с пакетом из дома"
 KOCH_B11_RELATIONS_GRODNO_desc:0 "Для первого визита в Гродно выделены дипломатический паспорт, чистая рубашка и пакет с гостинцами. Посол должен объяснить Артуру, что мы суверенное государство, несмотря на внешний вид делегации. Если разговор зайдёт о долгах, пакет следует торжественно вручить и сменить тему."
 KOCH_B11_PROTECT_ACE:0 "Охранять туз Артура"
 KOCH_B11_PROTECT_ACE_desc:0 "Президент Артур должен знать: его туз находится под нашей государственной защитой. Что именно угрожает тузу, установит охрана после получения финансирования. Культ требует почётного караула, Совет предлагает двух ответственных. Артуру направим заверение, что дополнительных подробностей ему лучше не знать."
 KOCH_B11_PACT_ACES:0 "Тузы под коллективной защитой"
 KOCH_B11_PACT_ACES_desc:0 "Закрепим особый статус туза международным соглашением. Культисты предлагают клятву перед святыней, Совет настаивает на двух подписях под каждой страницей. Артур просит хотя бы один экземпляр без следов еды. Пока дипломаты уточняют формулировки, населению объявят, что договорились о главном."
 KOCH_B11_BROTHERHOOD:0 "Побрататься без свидетелей"
 KOCH_B11_BROTHERHOOD_desc:0 "У наших стран обнаружено много общего: столицы, правительства и настойчивая просьба не задавать лишних вопросов. Объявим гродненско-подиковое братство. Церемонию проведём в узком кругу, чтобы ни один посторонний дипломат не успел спросить, кто кому кем приходится."
 KOCH_B11_ARTHUR_SUMMIT:0 "Артур, выйди на пять минут"
 KOCH_B11_ARTHUR_SUMMIT_desc:0 "Чрезвычайный саммит назначен по месту нахождения Артура. Президент ещё не подтвердил участие, поэтому пока ждём его у подъезда с флагами и складным столом. Повестка: региональная безопасность, доверие и возврат посуды с предыдущего братского визита."
 KOCH_B11_ONE_ALLIANCE_TWO_STATES:0 "Один союз, два алиби"
 KOCH_B11_ONE_ALLIANCE_TWO_STATES_desc:0 "По отдельности наши государства вызывают вопросы. Вместе мы сможем подтверждать показания друг друга на любом международном саммите. Пора оформить общий союз: пусть потенциальный противник заранее решит, готов ли он одновременно разбираться с Подиком, Советом и охраняемым тузом Артура."
 KOCH_B11_ACE_NOT_OUR_BUSINESS:0 "Туз Артура нас не касается"
 KOCH_B11_ACE_NOT_OUR_BUSINESS_desc:0 "Гродненская сторона должна самостоятельно решать вопросы своего туза. Мы не готовы втягиваться в обязательства, которые даже юристы стесняются произносить вслух. Направим официальное заявление о невмешательстве. Почему для него понадобились три страницы о личной ответственности Артура, МИД объяснить не смог."
 KOCH_B11_DEEP_CONCERN:0 "Озабочены до самого дна"
 KOCH_B11_DEEP_CONCERN_desc:0 "Артур не отреагировал на нашу первую ноту. Это требует более глубокой озабоченности. Поручим МИД измерить её глубину и выступить с заявлением: если Гродно продолжит игнорировать наши чувства, следующая нота будет напечатана шрифтом покрупнее."
 KOCH_B11_CONDEMN_ACE:0 "Тузу объявлен выговор"
 KOCH_B11_CONDEMN_ACE_desc:0 "Президенту Артуру направляется дипломатическое осуждение его туза с занесением в международное личное дело. На каком основании существует это дело, раскрывать запрещено. Ответа ждём немедленно: молчание будет истолковано как согласие с тем, что мы очень убедительно всё написали."
 KOCH_B11_GRODNO_ULTIMATUM:0 "Артур, это последнее письмо"
 KOCH_B11_GRODNO_ULTIMATUM_desc:0 "Дипломаты подготовили ультиматум с конкретными требованиями. Из первой редакции следует, что мы требуем уважения, из второй — извинений, из третьей — степлер обратно. Перед отправкой согласуем хотя бы адрес получателя. Внешняя политика достигла стадии, когда опечатка становится военным фактором."
 KOCH_B11_NOT_OUR_WAY:0 "Развод с видом на границу"
 KOCH_B11_NOT_OUR_WAY_desc:0 "Все совместные фотографии убраны со стен, братские сувениры переданы на ответственное хранение, пограничники получили приказ смотреть серьёзнее. Публике сообщат, что мы всегда подозревали Артура. Дружба закончилась; вопрос, насколько далеко должна зайти вражда, правительство пока оставляет открытым."
 KOCH_B11_EMERGENCY_LOGISTICS:0 "Скотч важнее генштаба"
 KOCH_B11_EMERGENCY_LOGISTICS_desc:0 "Колонна снабжения потеряла дорогу, накладные и интерес к происходящему. Наймём диспетчера, укрепим маршруты и выдадим складам скотч. Культ назовёт это заботой святыни, Совет припишет успех сразу обоим председателям. Грузовикам всё равно: им нужна дорога, а не авторство постановления."
 KOCH_B11_CARTRIDGE_FACTORY:0 "Гособоронкартридж"
 KOCH_B11_CARTRIDGE_FACTORY_desc:0 "Завод священных принадлежностей просит разрешения выпускать военную продукцию: оборудование уже есть, а за картриджи платят молитвами. Одобрим конверсию. На проходной останется прежний лозунг о мирном назначении предприятия; мешки с боеприпасами будут выносить через запасной выход. Культ направит энтузиазм на стройки, Совет подкрепит выпуск производственными контрактами."
 KOCH_B11_NATIONAL_MILITIA:0 "Кто в очереди — тот в строю"
 KOCH_B11_NATIONAL_MILITIA_desc:0 "У военкомата нет людей, зато у государственной лавки стоит очередь с рассвета. Совместим учреждения. Каждый гражданин сохранит своё место после прохождения службы, а спор о том, кто здесь последний, станет основой сержантской подготовки. Первую перекличку проведёт продавщица."
 KOCH_B11_PROPAGANDA_CIRCUS:0 "Новости раньше событий"
 KOCH_B11_PROPAGANDA_CIRCUS_desc:0 "Редакция предлагает печатать хорошие новости заранее: так типография сможет работать по плану. Завтрашние успехи уже согласованы, для сегодняшних осталось придумать фотографии. Культу предоставят рубрику чудес, Совету — два передовых мнения. Прогноз погоды разрешено публиковать без политической части."
 KOCH_B11_SCIENCE_OF_STUPIDITY:0 "Академия «А если вот так?»"
 KOCH_B11_SCIENCE_OF_STUPIDITY_desc:0 "В республике слишком много людей проводят опасные опыты на кухне. Соберём их в одном здании, выдадим халаты и потребуем записывать результаты до взрыва. Из десяти бессмысленных идей одна может оказаться полезной. Для оставшихся девяти есть ведомство государственных инициатив."
 KOCH_B11_BORDER_COMMITTEE:0 "Учения «Кто там ходит?»"
 KOCH_B11_BORDER_COMMITTEE_desc:0 "Во время проверки границы патруль задержал проверяющих, проверяющие арестовали патруль, а условный противник ушёл обедать. Проведём разбор и научим командиров узнавать собственную форму. Следующие учения усложним: документы выдадут заранее, а противник перестанет носить табличку."
 KOCH_B11_FINAL_MEMO:0 "Просим считать это государством"
 KOCH_B11_FINAL_MEMO_desc:0 "Республика пережила закупки, реформы, пророчества и заседания. Теперь у неё есть производство, вооружённые силы и папка документов, которую не стыдно предъявить на границе. Направим миру итоговую записку: всё вышеизложенное просим считать государственной политикой. Приложение с объяснениями уничтожено по соображениям национальной гордости."
 KOCH_B11_budget_crisis:0 "Экономика на одном картридже"
 KOCH_B11_new_epoch:0 "История после чека"
