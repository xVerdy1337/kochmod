l_english:
 KOCH_B07_mass_civil_protests:0 "Mass Civil Protests"
 KOCH_B07_mass_civil_protests_desc:0 "Mass protests undermine the administration's stability and public willingness to go to war. Amid growing discontent, support for fascists and authoritarians increases."
 KOCH_B03_high_crime:0 "High Crime"
 KOCH_B03_high_crime_desc:0 "Criminal gangs undermine order in the Volga Commune. Violence and corruption weaken the government, deplete manpower and disrupt mobilization and construction."
 KOCH_B03_backwater:0 "Backwater"
 KOCH_B03_backwater_desc:0 "Rural life encourages population growth, while infrastructure and railway development opens up new opportunities. However, a shortage of experienced advisors and inefficient logistics increase costs."
 KOCH_B08_state_of_scientists:0 "State of Scientists"
 KOCH_B08_state_of_scientists_desc:0 "The scientific community shapes ITMO development. Research, experimental facility construction and the introduction of new production methods enjoy state support."
 KOCH_B02_traditional_system:0 "Traditional System"
 KOCH_B02_traditional_system_desc:0 ""
 KOCH_B02_princely_army:0 "Princely Army"
 KOCH_B02_princely_army_desc:0 ""
 KOCH_B01_trilia_legacy:0 "Legacy of Trilia"
 KOCH_B01_trilia_legacy_desc:0 ""
 KOCH_B05_marxist_ideas:0 "Marxist Ideas"
 KOCH_B05_marxist_ideas_desc:0 "Marxist ideas shape the republic economic policy, accelerating construction and production development."
 KOCH_B05_terror:0 "Terror"
 KOCH_B05_terror_desc:0 "Repression and fear undermine population growth and deplete manpower. Advisors become more expensive and mobilization slows."
 KOCH_B04_democratic_bastion:0 "Bastion of Burbulek Democracy"
 KOCH_B04_democratic_bastion_desc:0 "Democratic institutions strengthen the republic stability. During a defensive war, army defense: §G+10%§!."
 KOCH_B04_bureaucratic_machine:0 "Bureaucratic Machine"
 KOCH_B04_bureaucratic_machine_desc:0 "An extensive administrative apparatus increases political influence, supports production efficiency growth and accelerates planning, but increases consumer goods requirements."
 KOCH_B04_defensive_war_bonus:0 "Democratic Defense in a Defensive War"
 KOCH_B07_economic_collapse:0 "Economic Collapse"
 KOCH_B07_economic_collapse_desc:0 "After the collapse of Burbulestan, the Moscow Administration failed to establish an effective economic policy, falling into recession until the final collapse."
 KOCH_B01_political_diversity:0 "Political Diversity"
 KOCH_B01_political_diversity_desc:0 "A variety of political forces makes advisors easier to recruit, but weakens stability and the resilience of the ruling ideology."
 KOCH_B04_pacifism:0 "Pacifism"
 KOCH_B04_pacifism_desc:0 "Society favors peaceful development over military preparations, limiting military factory construction and mobilization."
