l_english:
 KOCH_moscow_shared_tree:0 "The Moscow Administration Splits"
 KOCH_B07_choose_your_side:0 "On the Brink of a Split"
 KOCH_B07_choose_your_side_desc:0 "Political confrontation is tearing the Moscow Administration apart. Choose the side to support if tension reaches 100% and civil war begins. A peaceful resolution is still possible."
 KOCH_B07_democratic_path:0 "Defend the Administration"
 KOCH_B07_democratic_path_desc:0 "Remain loyal to the Moscow Administration. Defending the Administration reduces tension by 15 percentage points. If civil war still breaks out, we will remain with the defenders of Moscow."
 KOCH_B07_fascist_path:0 "Volokolamsk Order"
 KOCH_B07_fascist_path_desc:0 "Support Alexander Vanders' Volokolamsk Order. Once the civil war begins, we will lead the Order in its struggle for control of the former Administration."
 KOCH_B07_imperial_path:0 "Imperial Army"
 KOCH_B07_imperial_path_desc:0 "Support Nikita Kalinkin's Imperial Army. Once the civil war begins, we will lead the imperial forces in their struggle to restore the monarchy."
 KOCH_B07_side_choice_event_tt:0 "Opens the side selection event for a possible civil war. Tension rises by 1 percentage point every 3 days. Choosing the democrats reduces it by 15 points once."
 KOCH_B07_path_chosen_by_event_tt:0 "This focus is completed by choosing a side in the event Which Side Will We Take?"
 KOCH_B07_side_choice_title:0 "Which Side Will We Take?"
 KOCH_B07_side_choice_desc:0 "The Moscow Administration is on the brink of a split. Its democratic government intends to hold Moscow, Alexander Vanders leads the Volokolamsk Order, and Nikita Kalinkin commands the Imperial Army.\n\nChoose the side you will control if civil war begins."
 KOCH_B07_side_choice_democratic:0 "Remain with the Moscow Administration"
 KOCH_B07_side_choice_fascist:0 "Support the Volokolamsk Order"
 KOCH_B07_side_choice_imperial:0 "Join the Imperial Army"
 KOCH_B07_side_choice_democratic_tt:0 "Completes Defend the Administration and reduces tension by 15 percentage points. If civil war begins, you will continue to control the Moscow Administration."
 KOCH_B07_side_choice_fascist_tt:0 "Completes Volokolamsk Order without changing tension. If civil war begins, you will control the Volokolamsk Order under Alexander Vanders."
 KOCH_B07_side_choice_imperial_tt:0 "Completes Imperial Army without changing tension. If civil war begins, you will control the Imperial Army under Nikita Kalinkin."
 KOCH_B07_democratic_delay_tt:0 "During the active crisis, reduces tension by §G15 percentage points§! once."
