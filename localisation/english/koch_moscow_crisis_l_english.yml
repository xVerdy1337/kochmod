l_english:
 KOCH_B07_civil_war_category:0 "The Moscow Administration Splits"
 KOCH_B07_civil_war_category_desc:0 "§YPolitical tension:§! [GetKOCHMoscowTension]\n\nTension increases by §R1 percentage point every 3 days§!. At §R100%§!, a three-sided civil war begins. At §G0%§!, the crisis is permanently resolved and tension stops rising.\n\n§YBalance of Forces§!\nMoscow Administration: §Y[?KOCH_B07_strength_democrats|1]%§!\nVolokolamsk Order: §Y[?KOCH_B07_strength_fascists|1]%§!\nImperial Army: §Y[?KOCH_B07_strength_imperial|1]%§!\n\nSelected side: §Y[GetKOCHMoscowSelectedSide]§!\nGenerals recruited: §Y[?KOCH_B07_pledged_generals|0]§!"
 KOCH_B07_three_sided_war_tt:0 "A civil war begins between democrats, fascists and authoritarians. Each side will fight the other two."
 KOCH_B07_crisis_interrupted_title:0 "The Split Is Interrupted"
 KOCH_B07_crisis_interrupted_desc:0 "During the crisis, the Moscow Administration lost territory required for the planned partition. The civil war does not begin under the original plan."
 KOCH_MOSCOW_DEMOCRATS:0 "Moscow Administration"
 KOCH_MOSCOW_DEMOCRATS_DEF:0 "the Moscow Administration"
 KOCH_MOSCOW_DEMOCRATS_ADJ:0 "Muscovite"
 KOCH_MOSCOW_FASCISTS:0 "Volokolamsk Order"
 KOCH_MOSCOW_FASCISTS_DEF:0 "the Volokolamsk Order"
 KOCH_MOSCOW_FASCISTS_ADJ:0 "Volokolamsk"
 KOCH_MOSCOW_AUTHORITARIANS:0 "Imperial Army"
 KOCH_MOSCOW_AUTHORITARIANS_DEF:0 "the Imperial Army"
 KOCH_MOSCOW_AUTHORITARIANS_ADJ:0 "Imperial"
 KOCH_B07_civil_war_news_title:0 "Civil War in the Moscow Administration"
 KOCH_B07_civil_war_news_desc:0 "The political crisis in the Moscow Administration has escalated into open civil war. The democratic government holds Moscow, but two armed forces contest its authority over the remaining territories.\n\nAlexander Vanders' Volokolamsk Order has risen in Tver and Volokolamsk. In the south, Nikita Kalinkin's Imperial Army has taken up arms to restore the monarchy. All three sides are now at war with one another, splitting the former Administration into rival camps.\n\nNeighbouring states are watching closely: the struggle for Moscow could reshape the balance of power across the former Burbulestan."
 KOCH_B07_civil_war_news_option:0 "Moscow's future will be decided on the battlefield."
 KOCH_B07_resolve_crisis_tt:0 "Tension falls to §G0%§!. The crisis ends: the civil war is prevented and tension stops rising."
 KOCH_B07_tension_green:0 "§G[?KOCH_B07_tension|0]%§!"
 KOCH_B07_tension_yellow:0 "§Y[?KOCH_B07_tension|0]%§!"
 KOCH_B07_tension_red:0 "§R[?KOCH_B07_tension|0]%§!"
 KOCH_B07_recruit_officers:0 "Win Officers Over to Our Side"
 KOCH_B07_recruit_officers_desc:0 "Persuade officers to support our selected side. Preparation takes 30 days. Once complete, our side gains 5 percentage points of strength and each of the other two sides loses 2.5 points."
 KOCH_B07_recruit_general:0 "Win Over a General"
 KOCH_B07_recruit_general_desc:0 "Secure the allegiance of a random Moscow Administration general who has not pledged to any side. Preparation takes 30 days. Once complete, the general pledges to our side, its strength share increases by 5 percentage points, and each of the other two sides loses 2.5 points. The general joins our side when the civil war begins. Each general can be recruited only once."
 KOCH_B07_strength_can_increase_tt:0 "Each of the other two sides has at least 2.5% strength."
 KOCH_B07_unpledged_general_tt:0 "The Moscow Administration has a general who has not yet pledged to a side."
 KOCH_B07_strength_gain_tt:0 "Our selected side gains §G5 percentage points§! of strength. Each of the other two sides loses §R2.5 percentage points§!."
 KOCH_B07_general_pledge_tt:0 "§G1 random general§! of the Moscow Administration pledges to our selected side and joins it when the civil war begins. If the crisis ends peacefully, the general stays in the Administration."
 KOCH_B07_no_side_selected:0 "No side selected yet"
 KOCH_B07_balance_decisions_unlocked_tt:0 "During the crisis, unlocks Win Officers Over to Our Side and Win Over a General for the selected side."
 KOCH_B07_influence_preparation_tt:0 "Preparation takes §Y30 days§!. Changes take effect on completion if the political crisis is still ongoing."
