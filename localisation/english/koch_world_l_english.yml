l_english:
 KOCH_EMPTY_WORLD_NAME:0 "Clouds Gather over Burbulestan"
 KOCH_EMPTY_WORLD_DESC:0 "After an internal conflict, the members of Burbulestan split into independent states. Each has its own plans for Burbulestan and intends to reunite it. Their external enemies are also watching, determined to seize the Burbuleks' resources and riches. Clouds are gathering, and no one knows who will unite these lands under their rule..."
