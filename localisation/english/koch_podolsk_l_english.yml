 KOCH_B07_podolsk_protests_title:0 "Podolsk Research Facility Destroyed"
 KOCH_B07_podolsk_protests_desc:0 "On January 25, fascist protests in Podolsk escalated into riots. The local land warfare research facility was destroyed during the unrest. Its laboratories and equipment have been lost, bringing research to a halt. The unrest also damaged the transport network, reducing infrastructure in the Moscow region by 1 level. This blow to the Moscow Administration's scientific capabilities marks another escalation of the political crisis."
 KOCH_B07_podolsk_protests_option:0 "The crisis deepens..."
